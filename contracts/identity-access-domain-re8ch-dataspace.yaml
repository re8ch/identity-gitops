apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: identity-access-domain-re8ch-dataspace
spec:
  authorityDomain: identity-access
  target:
    cluster: re8ch
    namespace: re8ch-dataspace
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: re8ch/identity-gitops
    path: releases/identity-access-domain-re8ch-dataspace
  provenance:
    repository: re8ch/identity-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-identity-access
    audience: https://kube-api.re8ch.com/release-executor-identity-access
    signer: https://github.com/re8ch/identity-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/identity-access-domain-re8ch-dataspace
    resources:
    - core/PersistentVolumeClaim
    - core/Service
    - gateway.networking.k8s.io/HTTPRoute
    - networking.k8s.io/Ingress
    - networking.k8s.io/NetworkPolicy
    objectNames:
    - allow-public-gateway
    - dataspace-files
    - dataspace-gateway
    - storage-collaborator
    - storage-collaborator-public
    allowClusterScoped: false
    requireExisting: true
    forceConflictObjects:
    - core/Service/re8ch-dataspace/dataspace-gateway
    - gateway.networking.k8s.io/HTTPRoute/re8ch-dataspace/storage-collaborator-public
    - networking.k8s.io/Ingress/re8ch-dataspace/storage-collaborator
    - networking.k8s.io/NetworkPolicy/re8ch-dataspace/allow-public-gateway
  inventory:
    digest: sha256:f6eb57aad118e1de7d7c5c2e852379c3d5d2acad23b4cd47ac7cc291585333fa
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
