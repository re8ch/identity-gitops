apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: identity-access-domain-git-workspaces
spec:
  authorityDomain: identity-access
  target:
    cluster: re8ch
    namespace: git-workspaces
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: re8ch/identity-gitops
    path: releases/identity-access-domain-git-workspaces
  provenance:
    repository: re8ch/identity-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-identity-access
    audience: https://kube-api.re8ch.com/release-executor-identity-access
    signer: https://github.com/re8ch/identity-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/identity-access-domain-git-workspaces
    resources:
    - rbac.authorization.k8s.io/RoleBinding
    objectNames:
    - stalwart-mailbox-provisioner
    allowClusterScoped: false
    forceConflictObjects:
    - rbac.authorization.k8s.io/RoleBinding/git-workspaces/stalwart-mailbox-provisioner
  inventory:
    digest: sha256:895046343901a4e6e8b177e0b3da64281f07e72aaa00a1c361a3d238088152ff
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
