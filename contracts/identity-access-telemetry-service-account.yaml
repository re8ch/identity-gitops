apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: identity-access-telemetry-service-account
spec:
  authorityDomain: identity-access
  target: {cluster: re8ch, namespace: egress-fabric}
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: re8ch/identity-gitops
    path: releases/identity-access-telemetry-service-account
  provenance:
    repository: re8ch/identity-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-identity-access
    audience: https://kube-api.re8ch.com/release-executor-identity-access
    signer: https://github.com/re8ch/identity-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/identity-access-telemetry-service-account
    resources: [core/ServiceAccount]
    objectNames: [access-telemetry]
    allowClusterScoped: false
  inventory:
    digest: sha256:1b935dd57431008c21a5bc60fa5cacb4e463d6f94a9f56bc7b0c3d6e08de7280
  lifecycle:
    prune: true
    healthTimeoutSeconds: 120
    protectedKinds: [Namespace, CustomResourceDefinition, PersistentVolume, PersistentVolumeClaim, StorageClass]
    deletionAllowlist:
    - core/ServiceAccount/egress-fabric/access-telemetry
