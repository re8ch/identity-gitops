name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","r640","untrusted-build"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
      - run: python -m pip install 'PyYAML>=6.0.2' 'jsonschema>=4.23' 'pytest>=8' 'pytest>=8.3'
      - run: kubectl kustomize clusters/re8ch >/dev/null
      - run: kubectl kustomize releases/identity-access-telemetry-service-account >/dev/null
      - run: python3 policies/validate.py
      - run: python -m pytest -q
      - run: |
          kubectl kustomize releases/identity-access-telemetry-service-account > "$RUNNER_TEMP/rendered.yaml"
          python operations/releases/unified_bundle.py \
            --contract contracts/identity-access-telemetry-service-account.yaml \
            --rendered "$RUNNER_TEMP/rendered.yaml" \
            --output "$RUNNER_TEMP/release.bundle"
      - run: python -m pytest -q
      - name: Check complete native domain cohort
        run: python operations/releases/compile_domain.py --check
