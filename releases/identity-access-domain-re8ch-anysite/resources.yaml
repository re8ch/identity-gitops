---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  finalizers:
  - kubernetes.io/pvc-protection
  name: scale-cache
  namespace: re8ch-anysite
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
  volumeMode: Filesystem
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: anysite-postgrest
    app.kubernetes.io/part-of: anysite
  name: anysite-postgrest
  namespace: re8ch-anysite
spec:
  ports:
  - name: http
    port: 3000
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: anysite-postgrest
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: scale-api
  namespace: re8ch-anysite
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app: scale-api
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scale-api
  namespace: re8ch-anysite
spec:
  ingressClassName: advanced-fabric
  rules:
  - host: api.re8ch.com
    http:
      paths:
      - backend:
          service:
            name: scale-api
            port:
              name: http
        path: /anysite/scale
        pathType: Prefix
  - host: api-shanghai217.re8ch.com
    http:
      paths:
      - backend:
          service:
            name: scale-api
            port:
              name: http
        path: /anysite/scale
        pathType: Prefix
  - host: api-guangzhou24.re8ch.com
    http:
      paths:
      - backend:
          service:
            name: scale-api
            port:
              name: http
        path: /anysite/scale
        pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    migration.re8ch.com/source-namespace: anysite
    tenancy.re8ch.com/tenant: re8ch
  name: allow-public-gateway
  namespace: re8ch-anysite
spec:
  ingress:
  - ports:
    - port: 8000
      protocol: TCP
  podSelector:
    matchLabels:
      app: scale-api
  policyTypes:
  - Ingress
