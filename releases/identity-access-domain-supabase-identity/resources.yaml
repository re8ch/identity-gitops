          value: re8ch-avatars-1301339749
        - name: IDENTITY_AVATAR_COS_REGION
          value: ap-guangzhou
        - name: AVATAR_CPU_THREADS
          value: '2'
        - name: HF_HOME
          value: /tmp/hf
        - name: IDENTITY_PGRST_JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: JWT_SECRET
              name: supabase-identity-secrets
        - name: IDENTITY_AVATAR_COS_SECRET_ID
          valueFrom:
            secretKeyRef:
              key: AVATAR_COS_SECRET_ID
              name: supabase-identity-secrets
        - name: IDENTITY_AVATAR_COS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: AVATAR_COS_SECRET_KEY
              name: supabase-identity-secrets
        image: registry.re8ch.com/auth/identity-avatar-worker:20260929@sha256:f31e20ca87506c14276036abb7459ea34cda67458033655ad2fb92d55b19fef4
        imagePullPolicy: IfNotPresent
        name: worker
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
