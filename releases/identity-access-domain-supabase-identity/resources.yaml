kind: ConfigMap
metadata:
  name: supabase-identity-kong-config
  namespace: supabase-identity
---
apiVersion: v1
data:
  migration.sql: "do $$ begin if to_regprocedure('api.platform_user_update(uuid,text)')\
    \ is null then raise exception 'identity migration 048 is required'; end if; end\
    \ $$;\n-- Source: re8ch/cloud-functions@7832f51762a9959d022d51be7e5b643e5271fa97\n\
    -- Request handling is not erasure: completion records an operator's evidence.\n\
    -- Identity exports are generated on demand and never persisted as bearer URLs.\n\
    begin;\nalter table core.account_requests drop constraint if exists account_requests_status_check;\n\
    alter table core.account_requests add constraint account_requests_status_check\n\
    \ check(status in ('pending','in_progress','completed','rejected','cancelled'));\n\
    alter table core.account_requests add column if not exists version integer not\
    \ null default 1;\nalter table core.account_requests add column if not exists\
    \ evidence_ref text;\ncreate table if not exists core.account_request_events (\n\
    \ id bigint generated always as identity primary key,\n request_id uuid not null\
    \ references core.account_requests(id) on delete restrict,\n actor_id uuid references\
    \ auth.users(id) on delete set null,\n status text not null, note text, evidence_ref\
    \ text,\n created_at timestamptz not null default now()\n);\nalter table core.account_request_events\
    \ owner to supabase_admin;\nrevoke all on core.account_request_events from public,anon,authenticated;\n\
    \ncreate or replace function core.require_privacy_session()\nreturns uuid language\
    \ plpgsql stable security definer set search_path=pg_catalog,pg_temp as $$\ndeclare\
    \ u uuid := api.current_user_id();\nbegin\n if u is null or not auth.platform_session_active()\
    \ or not exists(\n  select 1 from auth.users where id=u and deleted_at is null)\
    \ then\n  raise exception 'active login session required' using errcode='28000';\n\
    \ end if;\n return u;\nend $$;\nalter function core.require_privacy_session()\
    \ owner to supabase_admin;\nrevoke all on function core.require_privacy_session()\
    \ from public,anon,authenticated;\n\ncreate or replace function core.privacy_request_json(r\
    \ core.account_requests)\nreturns jsonb language sql stable security definer set\
    \ search_path=pg_catalog,pg_temp as $$\n select jsonb_build_object('id',r.id,'type',r.request_type,'status',r.status,\n\
    \ 'createdAt',r.created_at,'updatedAt',r.updated_at,'version',r.version,'note',r.note,\n\
    \ 'history',coalesce((select jsonb_agg(jsonb_build_object('status',e.status,'note',e.note,\n\
    \ 'createdAt',e.created_at) order by e.id) from core.account_request_events e\
    \ where e.request_id=r.id),'[]'::jsonb))\n$$;\nalter function core.privacy_request_json(core.account_requests)\
    \ owner to supabase_admin;\nrevoke all on function core.privacy_request_json(core.account_requests)\
    \ from public,anon,authenticated;\n\ncreate or replace function api.request_account_action(p_request_type\
    \ text)\nreturns jsonb language plpgsql volatile security definer set search_path=pg_catalog,pg_temp\
    \ as $$\ndeclare u uuid := core.require_privacy_session(); r core.account_requests;\n\
    begin\n if p_request_type is null or p_request_type not in ('export','delete')\
    \ then\n  raise exception 'invalid request type' using errcode='22023';\n end\
    \ if;\n perform pg_advisory_xact_lock(hashtextextended('privacy:'||u::text||':'||p_request_type,0));\n\
    \ select * into r from core.account_requests where user_id=u and request_type=p_request_type\
    \ and status in ('pending','in_progress');\n if not found then\n  insert into\
    \ core.account_requests(user_id,request_type) values(u,p_request_type) returning\
    \ * into r;\n  insert into core.account_request_events(request_id,actor_id,status)\
    \ values(r.id,u,r.status);\n end if;\n return core.privacy_request_json(r);\n\
    end $$;\n\ncreate or replace function api.my_account_requests()\nreturns jsonb\
    \ language plpgsql stable security definer set search_path=pg_catalog,pg_temp\
    \ as $$\ndeclare u uuid := core.require_privacy_session(); result jsonb;\nbegin\n\
    \ select coalesce(jsonb_agg(core.privacy_request_json(r) order by r.created_at\
    \ desc,r.id),'[]'::jsonb)\n into result from core.account_requests r where r.user_id=u;\n\
    \ return result;\nend $$;\n\ncreate or replace function api.cancel_account_request(p_request_id\
    \ uuid,p_version integer)\nreturns jsonb language plpgsql volatile security definer\
    \ set search_path=pg_catalog,pg_temp as $$\ndeclare u uuid := core.require_privacy_session();\
    \ r core.account_requests;\nbegin\n select * into r from core.account_requests\
    \ where id=p_request_id and user_id=u for update;\n if not found then raise exception\
    \ 'request not found' using errcode='PT404';end if;\n if p_version is distinct\
    \ from r.version or r.status<>'pending' then\n  raise exception 'request changed\
    \ or processing already started; refresh the list' using errcode='23505';end if;\n\
    \ update core.account_requests set status='cancelled',updated_at=clock_timestamp(),version=version+1\
    \ where id=r.id returning * into r;\n insert into core.account_request_events(request_id,actor_id,status)\
    \ values(r.id,u,r.status);\n return core.privacy_request_json(r);\nend $$;\n\n\
    create or replace function api.admin_account_requests()\nreturns jsonb language\
    \ plpgsql stable security definer set search_path=pg_catalog,pg_temp as $$\ndeclare\
    \ u uuid := core.require_privacy_session(); result jsonb;\nbegin\n if not core.is_platform_admin(u)\
    \ then raise exception 'permission denied' using errcode='42501';end if;\n perform\
    \ core.require_admin_step_up();\n select coalesce(jsonb_agg(core.privacy_request_json(r)||jsonb_build_object('userId',r.user_id,\n\
    \ 'email',a.email,'evidenceRef',r.evidence_ref) order by r.created_at,r.id),'[]'::jsonb)\n\
    \ into result from core.account_requests r join auth.users a on a.id=r.user_id\n\
    \ where r.status in ('pending','in_progress');\n return result;\nend $$;\n\ncreate\
    \ or replace function api.admin_update_account_request(p_request_id uuid,p_version\
    \ integer,p_status text,p_note text,p_evidence_ref text default null)\nreturns\
    \ jsonb language plpgsql volatile security definer set search_path=pg_catalog,pg_temp\
    \ as $$\ndeclare u uuid := core.require_privacy_session(); r core.account_requests;\n\
    begin\n if not core.is_platform_admin(u) then raise exception 'permission denied'\
    \ using errcode='42501';end if;\n perform core.require_admin_step_up();\n if p_status\
    \ is null or p_status not in ('in_progress','completed','rejected') or\n p_note\
    \ is null or length(btrim(p_note)) not between 1 and 2000 or\n (p_evidence_ref\
    \ is not null and length(btrim(p_evidence_ref)) not between 1 and 500) then\n\
    \  raise exception 'invalid status, note or evidence reference' using errcode='22023';end\
    \ if;\n if p_status='completed' and nullif(btrim(p_evidence_ref),'') is null then\n\
    \  raise exception 'completion requires a fulfillment evidence reference' using\
    \ errcode='22023';end if;\n select * into r from core.account_requests where id=p_request_id\
    \ for update;\n if not found then raise exception 'request not found' using errcode='PT404';end\
    \ if;\n if p_version is distinct from r.version or not (\n  (r.status='pending'\
    \ and p_status in ('in_progress','rejected')) or\n  (r.status='in_progress' and\
    \ p_status in ('in_progress','completed','rejected'))) then\n  raise exception\
    \ 'request changed or transition is not allowed' using errcode='23505';end if;\n\
    \ update core.account_requests set status=p_status,note=btrim(p_note),evidence_ref=nullif(btrim(p_evidence_ref),''),\n\
    \ handled_by=u,updated_at=clock_timestamp(),version=version+1 where id=r.id returning\
    \ * into r;\n insert into core.account_request_events(request_id,actor_id,status,note,evidence_ref)\n\
    \ values(r.id,u,r.status,r.note,r.evidence_ref);\n return core.privacy_request_json(r);\n\
    end $$;\n\ncreate or replace function api.my_identity_export()\nreturns jsonb\
    \ language plpgsql stable security definer set search_path=pg_catalog,pg_temp\
    \ as $$\ndeclare u uuid := core.require_privacy_session();\nbegin\n return jsonb_build_object('schemaVersion',1,'generatedAt',statement_timestamp(),'userId',u,\n\
    \ 'scope','identity-only','excludes',jsonb_build_array('authentication secrets','other\
    \ users','product data','billing records','infrastructure resources'),\n 'profile',api.my_profile(),\n\
    \ 'memberships',coalesce((select jsonb_agg(jsonb_build_object('tenantRef',tenant_ref,'role',role,'status',status,'permissions',permissions)\
    \ order by tenant_ref)\n from core.organization_members where user_id=u),'[]'::jsonb),\n\
    \ 'devices',coalesce((select jsonb_agg(jsonb_build_object('label',label,'firstSeenAt',first_seen_at,'lastSeenAt',last_seen_at)\
    \ order by id)\n from core.user_devices where user_id=u),'[]'::jsonb),\n 'requests',api.my_account_requests());\n\
    end $$;\n\nalter function api.request_account_action(text) owner to supabase_admin;\n\
    alter function api.my_account_requests() owner to supabase_admin;\nalter function\
    \ api.cancel_account_request(uuid,integer) owner to supabase_admin;\nalter function\
    \ api.admin_account_requests() owner to supabase_admin;\nalter function api.admin_update_account_request(uuid,integer,text,text,text)\
    \ owner to supabase_admin;\nalter function api.my_identity_export() owner to supabase_admin;\n\
    revoke all on function api.request_account_action(text),api.my_account_requests(),api.cancel_account_request(uuid,integer),\n\
    \ api.admin_account_requests(),api.admin_update_account_request(uuid,integer,text,text,text),api.my_identity_export()\
    \ from public,anon;\ngrant execute on function api.request_account_action(text),api.my_account_requests(),api.cancel_account_request(uuid,integer),\n\
    \ api.admin_account_requests(),api.admin_update_account_request(uuid,integer,text,text,text),api.my_identity_export()\
    \ to authenticated;\nnotify pgrst,'reload schema';\ncommit;\n"
