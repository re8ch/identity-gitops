    \      when 'member' then 'operator'\n      when 'viewer' then 'viewer'\n    end\n\
    \  from core.organization_members m\n  join core.organizations o on o.tenant_ref\
    \ = m.tenant_ref\n  join auth.users u on u.id = m.user_id\n  where m.user_id =\
    \ api.current_user_id()\n    and m.status = 'active' and o.status = 'active'\n\
    \    and u.deleted_at is null\n    and m.role in ('owner', 'admin', 'member',\
    \ 'viewer')\n$$;\nrevoke all on function api.my_tenant_runtime_memberships() from\
    \ public, anon, service_role;\ngrant usage on schema api to authenticated;\ngrant\
    \ execute on function api.my_tenant_runtime_memberships() to authenticated;\n\
    alter function api.my_tenant_runtime_memberships() owner to supabase_admin;\n\
    commit;\n"
