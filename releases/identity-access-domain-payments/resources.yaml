---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-postgrest-ro
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commerce-postgrest-ro
  template:
    metadata:
      labels:
        app: commerce-postgrest-ro
    spec:
      containers:
      - env:
        - name: PGRST_DB_URI
          valueFrom:
            secretKeyRef:
              key: PGRST_DB_URI_RO
              name: commerce-postgrest-secrets
        - name: PGRST_DB_SCHEMAS
          value: commerce_api
        - name: PGRST_DB_ANON_ROLE
          value: billing_commerce_anon
        - name: PGRST_JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: PGRST_JWT_SECRET
              name: commerce-postgrest-secrets
        image: docker.io/postgrest/postgrest:v14.1@sha256:e9490aa503a5fb07d8e8c80da46e5c0c193894e583b59ed9077e74c4101ffae2
        name: postgrest
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      nodeSelector:
        kubernetes.io/hostname: r640
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
---
