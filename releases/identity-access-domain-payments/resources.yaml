apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: commerce-db-ro
  namespace: payments
spec:
  hostnames:
  - db-ro.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: db-ro-https
  - name: re8ch-region-loudi
    namespace: kube-system
    sectionName: db-ro-https
  - name: re8ch-region-guangzhou
    namespace: kube-system
    sectionName: db-ro-https
  - name: re8ch-region-shanghai
    namespace: kube-system
    sectionName: db-ro-https
  - name: re8ch-region-hangzhou-nuclio
    namespace: kube-system
    sectionName: db-ro-https
  - name: re8ch-region-shanghai-nuclio
    namespace: kube-system
    sectionName: db-ro-https
  rules:
  - backendRefs:
    - name: commerce-api
      port: 8080
    matches:
    - method: GET
      path:
        type: PathPrefix
        value: /commerce/v1
    - method: HEAD
      path:
        type: PathPrefix
        value: /commerce/v1
    - method: OPTIONS
      path:
        type: PathPrefix
        value: /commerce/v1
  - backendRefs:
    - name: commerce-postgrest-ro
      port: 3000
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /commerce
---
