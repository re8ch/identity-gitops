apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: re8ch-catalog
    app.kubernetes.io/part-of: catalog
  name: re8ch-catalog
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: re8ch-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: re8ch-catalog
        app.kubernetes.io/part-of: catalog
    spec:
      containers:
      - env:
        - name: IDENTITY_USER_URL
          value: http://supabase-identity-auth.supabase-identity.svc:9999/user
        - name: IDENTITY_REST_URL
          value: http://supabase-identity-rest-ro.supabase-identity.svc:3000
        - name: BILLING_RO_URL
          value: http://payment-postgrest-ro.payments.svc:3000
        - name: BILLING_RW_URL
          value: http://payment-postgrest.payments.svc:3000
        - name: BILLING_JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: PGRST_JWT_SECRET
              name: billing-payment-postgrest-secrets
        image: ghcr.io/re8ch-business/catalog@sha256:193f96aaad40bc1a3ff0032f39bde3c31586a8bf301ff92f3e9e6b40a30b64d3
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        name: catalog
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      imagePullSecrets:
      - name: ghcr-re8ch
      nodeSelector:
        kubernetes.io/hostname: r640
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
