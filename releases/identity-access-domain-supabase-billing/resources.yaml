apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: supabase-billing-pigsty
  namespace: supabase-billing
spec:
  egress:
  - toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
    toServices:
    - k8sService:
        namespace: pigsty-external
        serviceName: pg-re8ch-primary
  - toEntities:
    - host
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  endpointSelector: {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: supabase-billing-public-edge
  namespace: supabase-billing
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: kong
  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: '8000'
        protocol: TCP
---
apiVersion: v1
data:
  ADDITIONAL_REDIRECT_URLS: ''
  API_EXTERNAL_URL: https://billing-supabase.re8ch.com
  DISABLE_SIGNUP: 'true'
  ENABLE_ANONYMOUS_USERS: 'false'
  ENABLE_EMAIL_AUTOCONFIRM: 'true'
  ENABLE_EMAIL_SIGNUP: 'false'
  ENABLE_PHONE_AUTOCONFIRM: 'false'
  ENABLE_PHONE_SIGNUP: 'false'
  GLOBAL_S3_BUCKET: supabase-billing
  IMGPROXY_AUTO_WEBP: 'true'
  JWT_EXPIRY: '3600'
  MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
  MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
  MAILER_URLPATHS_INVITE: /auth/v1/verify
  MAILER_URLPATHS_RECOVERY: /auth/v1/verify
  PGRST_DB_EXTRA_SEARCH_PATH: public,payment,billing,commerce
  PGRST_DB_MAX_ROWS: '1000'
  PGRST_DB_SCHEMAS: payment_api,commerce_api
  POSTGRES_DB: re8ch_billing
  POSTGRES_HOST: pg-re8ch-primary.pigsty-external.svc.cluster.local
  POSTGRES_PORT: '5432'
  REGION: r640-lan
  S3_PROTOCOL_ACCESS_KEY_ID: ''
  S3_PROTOCOL_ACCESS_KEY_SECRET: ''
  SITE_URL: https://billing-supabase.re8ch.com
  SMTP_ADMIN_EMAIL: ops@re8ch.com
  SMTP_HOST: localhost
  SMTP_PASS: ''
  SMTP_PORT: '25'
  SMTP_SENDER_NAME: RE8CH Supabase
  SMTP_USER: ''
  STORAGE_TENANT_ID: re8ch-billing
  STUDIO_DEFAULT_ORGANIZATION: RE8CH
  STUDIO_DEFAULT_PROJECT: re8ch_billing
  SUPABASE_PUBLIC_URL: https://billing-supabase.re8ch.com
kind: ConfigMap
metadata:
  name: supabase-billing-env
  namespace: supabase-billing
---
apiVersion: v1
data:
  kong-entrypoint.sh: "#!/bin/sh\nif [ -n \"$SUPABASE_SECRET_KEY\" ] && [ -n \"$SUPABASE_PUBLISHABLE_KEY\"\
    \ ]; then\n  export LUA_AUTH_EXPR=\"\\$((headers.authorization ~= nil and headers.authorization:sub(1,\
    \ 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '$SUPABASE_SECRET_KEY'\
    \ and 'Bearer $SERVICE_ROLE_KEY_ASYMMETRIC') or (headers.apikey == '$SUPABASE_PUBLISHABLE_KEY'\
    \ and 'Bearer $ANON_KEY_ASYMMETRIC') or headers.apikey)\"\n  export LUA_RT_WS_EXPR=\"\
    \\$((query_params.apikey == '$SUPABASE_SECRET_KEY' and '$SERVICE_ROLE_KEY_ASYMMETRIC')\
    \ or (query_params.apikey == '$SUPABASE_PUBLISHABLE_KEY' and '$ANON_KEY_ASYMMETRIC')\
    \ or query_params.apikey)\"\nelse\n  export LUA_AUTH_EXPR=\"\\$((headers.authorization\
    \ ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization)\
    \ or headers.apikey)\"\n  export LUA_RT_WS_EXPR=\"\\$(query_params.apikey)\"\n\
    fi\nawk '{\n  result = \"\"\n  rest = $0\n  while (match(rest, /\\$[A-Za-z_][A-Za-z_0-9]*/))\
    \ {\n    varname = substr(rest, RSTART + 1, RLENGTH - 1)\n    if (varname in ENVIRON)\
    \ {\n      result = result substr(rest, 1, RSTART - 1) ENVIRON[varname]\n    }\
    \ else {\n      result = result substr(rest, 1, RSTART + RLENGTH - 1)\n    }\n\
    \    rest = substr(rest, RSTART + RLENGTH)\n  }\n  print result rest\n}' /home/kong/temp.yml\
    \ > \"$KONG_DECLARATIVE_CONFIG\"\nsed -i '/^[[:space:]]*- key:[[:space:]]*$/d'\
    \ \"$KONG_DECLARATIVE_CONFIG\"\nexec /entrypoint.sh kong docker-start\n"
  kong.yml: "_format_version: '2.1'\n_transform: true\nconsumers:\n  - username: DASHBOARD\n\
    \  - username: anon\n    keyauth_credentials:\n      - key: $SUPABASE_ANON_KEY\n\
    \  - username: service_role\n    keyauth_credentials:\n      - key: $SUPABASE_SERVICE_KEY\n\
    acls:\n  - consumer: anon\n    group: anon\n  - consumer: service_role\n    group:\
    \ admin\nbasicauth_credentials:\n  - consumer: DASHBOARD\n    username: '$DASHBOARD_USERNAME'\n\
    \    password: '$DASHBOARD_PASSWORD'\nservices:\n  - name: auth-v1-open\n    url:\
    \ http://supabase-billing-auth:9999/verify\n    routes:\n      - name: auth-v1-open\n\
    \        strip_path: true\n        paths: [/auth/v1/verify]\n    plugins:\n  \
    \    - name: cors\n  - name: auth-v1-open-callback\n    url: http://supabase-billing-auth:9999/callback\n\
    \    routes:\n      - name: auth-v1-open-callback\n        strip_path: true\n\
    \        paths: [/auth/v1/callback]\n    plugins:\n      - name: cors\n  - name:\
    \ auth-v1-open-authorize\n    url: http://supabase-billing-auth:9999/authorize\n\
    \    routes:\n      - name: auth-v1-open-authorize\n        strip_path: true\n\
    \        paths: [/auth/v1/authorize]\n    plugins:\n      - name: cors\n  - name:\
    \ auth-v1\n    url: http://supabase-billing-auth:9999/\n    routes:\n      - name:\
    \ auth-v1-all\n        strip_path: true\n        paths: [/auth/v1/]\n    plugins:\n\
    \      - name: cors\n      - name: key-auth\n        config:\n          hide_credentials:\
    \ false\n      - name: request-transformer\n        config:\n          replace:\n\
    \            headers:\n              - \"Authorization: $LUA_AUTH_EXPR\"\n   \
    \   - name: acl\n        config:\n          hide_groups_header: true\n       \
    \   allow: [admin, anon]\n  - name: rest-v1\n    url: http://supabase-billing-rest:3000/\n\
    \    routes:\n      - name: rest-v1-all\n        strip_path: true\n        paths:\
    \ [/rest/v1/]\n    plugins:\n      - name: cors\n      - name: key-auth\n    \
    \    config:\n          hide_credentials: false\n      - name: request-transformer\n\
    \        config:\n          replace:\n            headers:\n              - \"\
    Authorization: $LUA_AUTH_EXPR\"\n      - name: acl\n        config:\n        \
    \  hide_groups_header: true\n          allow: [admin, anon]\n  - name: realtime-v1-ws\n\
    \    url: http://supabase-billing-realtime:4000/socket\n    protocol: ws\n   \
    \ routes:\n      - name: realtime-v1-ws\n        strip_path: true\n        paths:\
    \ [/realtime/v1/]\n    plugins:\n      - name: cors\n      - name: key-auth\n\
    \        config:\n          hide_credentials: false\n      - name: request-transformer\n\
    \        config:\n          add:\n            headers:\n              - \"x-api-key:$LUA_RT_WS_EXPR\"\
    \n          replace:\n            querystring:\n              - \"apikey:$LUA_RT_WS_EXPR\"\
    \n      - name: acl\n        config:\n          hide_groups_header: true\n   \
    \       allow: [admin, anon]\n  - name: realtime-v1-rest\n    url: http://supabase-billing-realtime:4000/api\n\
    \    routes:\n      - name: realtime-v1-rest\n        strip_path: true\n     \
    \   paths: [/realtime/v1/api]\n    plugins:\n      - name: cors\n      - name:\
    \ key-auth\n        config:\n          hide_credentials: false\n      - name:\
    \ request-transformer\n        config:\n          replace:\n            headers:\n\
    \              - \"Authorization: $LUA_AUTH_EXPR\"\n      - name: acl\n      \
    \  config:\n          hide_groups_header: true\n          allow: [admin, anon]\n\
    \  - name: storage-v1\n    url: http://supabase-billing-storage:5000/\n    routes:\n\
    \      - name: storage-v1-all\n        strip_path: true\n        paths: [/storage/v1/]\n\
    \    plugins:\n      - name: cors\n      - name: request-transformer\n       \
    \ config:\n          replace:\n            headers:\n              - \"Authorization:\
    \ $LUA_AUTH_EXPR\"\n  - name: meta\n    url: http://supabase-billing-meta:8080/\n\
    \    routes:\n      - name: meta-all\n        strip_path: true\n        paths:\
    \ [/pg/]\n    plugins:\n      - name: key-auth\n        config:\n          hide_credentials:\
    \ false\n      - name: acl\n        config:\n          hide_groups_header: true\n\
    \          allow: [admin]\n  - name: dashboard\n    url: http://supabase-billing-studio:3000/\n\
    \    routes:\n      - name: dashboard-all\n        strip_path: true\n        paths:\
    \ [/]\n    plugins:\n      - name: cors\n      - name: basic-auth\n        config:\n\
    \          hide_credentials: true\n"
kind: ConfigMap
metadata:
  name: supabase-billing-kong-config
  namespace: supabase-billing
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: supabase-billing-storage
  namespace: supabase-billing
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: rbd-r640
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: supabase-billing-quota
  namespace: supabase-billing
spec:
  hard:
    limits.cpu: 5000m
    limits.memory: 12288Mi
    requests.cpu: 1500m
    requests.memory: 4096Mi
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-billing
  namespace: supabase-billing
spec:
  ports:
  - name: http
    port: 8000
    targetPort: 3000
  selector:
    app.kubernetes.io/component: studio
    app.kubernetes.io/part-of: supabase-billing
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-billing-auth
  namespace: supabase-billing
spec:
  ports:
  - name: http
    port: 9999
    targetPort: 9999
  selector:
    app.kubernetes.io/component: auth
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-billing-imgproxy
  namespace: supabase-billing
spec:
  ports:
  - name: http
