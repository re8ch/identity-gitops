---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-billing-auth
  namespace: supabase-billing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: auth
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: auth
        app.kubernetes.io/part-of: supabase-billing
    spec:
      containers:
      - env:
        - name: GOTRUE_API_HOST
          value: 0.0.0.0
        - name: GOTRUE_API_PORT
          value: '9999'
        - name: GOTRUE_DB_DRIVER
          value: postgres
        - name: GOTRUE_DB_DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: GOTRUE_DB_DATABASE_URL
              name: supabase-billing-secrets
        - name: GOTRUE_SITE_URL
          valueFrom:
            configMapKeyRef:
              key: SITE_URL
              name: supabase-billing-env
        - name: GOTRUE_URI_ALLOW_LIST
          valueFrom:
            configMapKeyRef:
              key: ADDITIONAL_REDIRECT_URLS
              name: supabase-billing-env
        - name: GOTRUE_DISABLE_SIGNUP
          valueFrom:
            configMapKeyRef:
              key: DISABLE_SIGNUP
              name: supabase-billing-env
        - name: GOTRUE_JWT_ADMIN_ROLES
          value: service_role
        - name: GOTRUE_JWT_AUD
          value: authenticated
        - name: GOTRUE_JWT_DEFAULT_GROUP_NAME
          value: authenticated
        - name: GOTRUE_JWT_EXP
          valueFrom:
            configMapKeyRef:
              key: JWT_EXPIRY
              name: supabase-billing-env
        - name: GOTRUE_JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: JWT_SECRET
              name: supabase-billing-secrets
        - name: GOTRUE_JWT_ISSUER
          valueFrom:
            configMapKeyRef:
              key: API_EXTERNAL_URL
              name: supabase-billing-env
        - name: GOTRUE_EXTERNAL_EMAIL_ENABLED
          valueFrom:
            configMapKeyRef:
              key: ENABLE_EMAIL_SIGNUP
              name: supabase-billing-env
        - name: GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED
          valueFrom:
            configMapKeyRef:
              key: ENABLE_ANONYMOUS_USERS
              name: supabase-billing-env
        - name: GOTRUE_MAILER_AUTOCONFIRM
          valueFrom:
            configMapKeyRef:
              key: ENABLE_EMAIL_AUTOCONFIRM
              name: supabase-billing-env
        - name: GOTRUE_EXTERNAL_PHONE_ENABLED
          valueFrom:
            configMapKeyRef:
              key: ENABLE_PHONE_SIGNUP
              name: supabase-billing-env
        - name: GOTRUE_SMS_AUTOCONFIRM
          valueFrom:
            configMapKeyRef:
              key: ENABLE_PHONE_AUTOCONFIRM
              name: supabase-billing-env
        - name: GOTRUE_EXTERNAL_KEYCLOAK_ENABLED
          value: 'true'
        - name: GOTRUE_EXTERNAL_KEYCLOAK_URL
          value: https://db-rw.re8ch.com/auth/v1
        - name: GOTRUE_EXTERNAL_KEYCLOAK_REDIRECT_URI
          value: https://billing-supabase.re8ch.com/auth/v1/callback
        - name: GOTRUE_EXTERNAL_KEYCLOAK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              key: IDENTITY_OIDC_CLIENT_ID
              name: supabase-billing-secrets
        - name: GOTRUE_EXTERNAL_KEYCLOAK_SECRET
          valueFrom:
            secretKeyRef:
              key: IDENTITY_OIDC_CLIENT_SECRET
              name: supabase-billing-secrets
        envFrom:
        - configMapRef:
            name: supabase-billing-env
        - secretRef:
            name: supabase-billing-secrets
        image: registry.re8ch.com/auth/supabase-auth:v2.196.0@sha256:1ac1f43d16100d8c89ad39462e3e1d9e25fb121ccdd6748f2766b34cd0edf1c2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          periodSeconds: 30
          tcpSocket:
            port: http
        name: auth
        ports:
        - containerPort: 9999
          name: http
        readinessProbe:
          periodSeconds: 10
          tcpSocket:
            port: http
        resources:
          limits:
            cpu: 100m
            memory: 384Mi
          requests:
            cpu: 50m
            memory: 128Mi
        startupProbe:
          failureThreshold: 24
          periodSeconds: 5
          tcpSocket:
            port: http
      imagePullSecrets:
      - name: supabase-billing-harbor-pull
      nodeSelector:
        kubernetes.io/hostname: r640
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: pg-re8ch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-billing-realtime
  namespace: supabase-billing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: realtime
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: realtime
        app.kubernetes.io/part-of: supabase-billing
    spec:
      containers:
      - env:
        - name: PORT
          value: '4000'
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              key: POSTGRES_HOST
              name: supabase-billing-env
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              key: POSTGRES_PORT
              name: supabase-billing-env
        - name: DB_USER
          value: billing_realtime_admin
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REALTIME_DB_PASSWORD
              name: supabase-billing-secrets
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              key: POSTGRES_DB
              name: supabase-billing-env
        - name: DB_AFTER_CONNECT_QUERY
          value: SET search_path TO _realtime
        - name: DB_ENC_KEY
          valueFrom:
            secretKeyRef:
              key: REALTIME_DB_ENC_KEY
              name: supabase-billing-secrets
        - name: API_JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: JWT_SECRET
              name: supabase-billing-secrets
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              key: SECRET_KEY_BASE
              name: supabase-billing-secrets
        - name: METRICS_JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: JWT_SECRET
              name: supabase-billing-secrets
        - name: ERL_AFLAGS
          value: -proto_dist inet_tcp
        - name: DNS_NODES
          value: ''''''
        - name: RLIMIT_NOFILE
          value: '10000'
        - name: APP_NAME
          value: realtime
        - name: SEED_SELF_HOST
          value: 'true'
        - name: SELF_HOST_TENANT_NAME
          value: supabase-billing-realtime
        - name: RUN_JANITOR
          value: 'true'
        - name: DISABLE_HEALTHCHECK_LOGGING
          value: 'true'
        envFrom:
        - configMapRef:
            name: supabase-billing-env
        - secretRef:
            name: supabase-billing-secrets
        image: docker.io/supabase/realtime:v2.134.10@sha256:c1d078d929608f3eb4d441e30317bbdccc1bfcc1169efa3d1a26d4252417cc76
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          periodSeconds: 30
          tcpSocket:
            port: http
        name: realtime
        ports:
        - containerPort: 4000
          name: http
        readinessProbe:
          periodSeconds: 10
          tcpSocket:
            port: http
        resources:
          limits:
            cpu: 150m
            memory: 512Mi
          requests:
            cpu: 80m
            memory: 128Mi
        startupProbe:
          failureThreshold: 60
          periodSeconds: 5
          tcpSocket:
            port: http
      nodeSelector:
        kubernetes.io/hostname: r640
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: pg-re8ch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-billing-rest-ro
  namespace: supabase-billing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: rest-ro
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rest-ro
        app.kubernetes.io/part-of: supabase-billing
    spec:
      containers:
      - env:
        - name: PGRST_DB_URI
          valueFrom:
            secretKeyRef:
              key: PGRST_DB_URI_RO
              name: supabase-billing-secrets
        - name: PGRST_DB_SCHEMAS
          value: payment_api,commerce_api
        - name: PGRST_DB_EXTRA_SEARCH_PATH
          value: public,payment,billing,commerce
        - name: PGRST_DB_ANON_ROLE
          value: billing_commerce_anon
        - name: PGRST_JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: JWT_SECRET
              name: supabase-billing-secrets
        - name: PGRST_DB_USE_LEGACY_GUCS
          value: 'false'
        - name: PGRST_DB_CHANNEL_ENABLED
          value: 'false'
        - name: PGRST_ADMIN_SERVER_PORT
          value: '3001'
        image: docker.io/postgrest/postgrest:v14.12@sha256:54000f24847d01a2c2302e0041cf0618b875c57fb48507d743cfa9aaa50bf43c
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /live
            port: admin
          periodSeconds: 30
        name: rest
        ports:
        - containerPort: 3000
          name: http
        - containerPort: 3001
          name: admin
        readinessProbe:
          httpGet:
            path: /ready
            port: admin
          periodSeconds: 10
        resources:
          limits:
            cpu: 250m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 24
          httpGet:
            path: /ready
            port: admin
          periodSeconds: 5
      nodeSelector:
        kubernetes.io/hostname: r640
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: pg-re8ch
---
