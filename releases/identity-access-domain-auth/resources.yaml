---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: auth-postgrest
    app.kubernetes.io/part-of: re8ch-auth
  name: auth-postgrest
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-postgrest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-postgrest
        app.kubernetes.io/part-of: re8ch-auth
    spec:
      containers:
      - env:
        - name: PGRST_DB_URI
          valueFrom:
            secretKeyRef:
              key: PGRST_DB_URI
              name: auth-db-credentials
        - name: PGRST_DB_SCHEMAS
          value: api
        - name: PGRST_ADMIN_SERVER_PORT
          value: '3001'
        - name: PGRST_JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: PGRST_JWT_SECRET
              name: re8ch-auth-gateway-secrets
        - name: PGRST_DB_POOL
          value: '10'
        image: docker.io/postgrest/postgrest:v14.1@sha256:e9490aa503a5fb07d8e8c80da46e5c0c193894e583b59ed9077e74c4101ffae2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          tcpSocket:
            port: http
        name: postgrest
        ports:
        - containerPort: 3000
          name: http
        - containerPort: 3001
          name: admin
        readinessProbe:
          httpGet:
            path: /ready
            port: admin
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          limits:
            cpu: 300m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
      nodeSelector:
        scheduling.re8ch.com/pool-service-core-r640: 'true'
---
apiVersion: v1
kind: Service
metadata:
  name: auth-postgrest
  namespace: auth
spec:
  clusterIP: 10.43.181.184
  ports:
  - name: http
    port: 3000
    targetPort: http
  - name: admin
    port: 3001
    targetPort: admin
  selector:
    app.kubernetes.io/name: auth-postgrest
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/name: re8ch-auth-gateway
    app.kubernetes.io/part-of: re8ch-auth
    saas.re8ch.com/function: gateway
    saas.re8ch.com/product: re8ch-auth
    saas.re8ch.com/tenant: auth
  name: re8ch-auth-gateway
  namespace: auth
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: re8ch-auth-gateway
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: re8ch-user-center
  namespace: auth
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: re8ch-user-center
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: re8ch-auth-edgeone-origin
  namespace: auth
spec:
  hostnames:
  - auth-origin.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: auth-origin-https
  rules:
  - backendRefs:
    - name: re8ch-auth-gateway
      port: 8080
    filters:
    - type: URLRewrite
      urlRewrite:
        hostname: auth.re8ch.com
        path:
          replaceFullPath: /.well-known/openid-configuration
          type: ReplaceFullPath
    matches:
    - path:
        type: Exact
        value: /.well-known/oauth-authorization-server
  - backendRefs:
    - name: supabase-identity-auth
      namespace: supabase-identity
      port: 9999
    filters:
    - type: URLRewrite
      urlRewrite:
        hostname: auth.re8ch.com
        path:
          replacePrefixMatch: /
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /auth/v1
  - backendRefs:
    - name: re8ch-user-center
      port: 80
    filters:
    - type: URLRewrite
      urlRewrite:
        hostname: auth.re8ch.com
    matches:
    - path:
        type: Exact
        value: /data-deletion.html
  - backendRefs:
    - name: re8ch-user-center
      port: 80
    filters:
    - type: URLRewrite
      urlRewrite:
        hostname: auth.re8ch.com
    matches:
    - path:
        type: Exact
        value: /logo.svg
  - backendRefs:
    - name: re8ch-auth-gateway
      port: 8080
    filters:
    - type: URLRewrite
      urlRewrite:
        hostname: auth.re8ch.com
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: re8ch-auth-postgrest-discovery
  namespace: auth
spec:
  hostnames:
  - db-rw.re8ch.com
  - db-ro.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: db-rw-https
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: db-ro-https
  - name: re8ch-region-loudi
    namespace: kube-system
    sectionName: db-rw-https
  - name: re8ch-region-loudi
    namespace: kube-system
    sectionName: db-ro-https
  - name: re8ch-region-guangzhou
    namespace: kube-system
    sectionName: db-rw-https
  - name: re8ch-region-guangzhou
    namespace: kube-system
    sectionName: db-ro-https
  - name: re8ch-region-shanghai
    namespace: kube-system
    sectionName: db-rw-https
  - name: re8ch-region-shanghai
    namespace: kube-system
    sectionName: db-ro-https
  - name: re8ch-region-hangzhou-nuclio
    namespace: kube-system
    sectionName: db-rw-https
  - name: re8ch-region-hangzhou-nuclio
    namespace: kube-system
    sectionName: db-ro-https
  - name: re8ch-region-shanghai-nuclio
    namespace: kube-system
    sectionName: db-rw-https
  - name: re8ch-region-shanghai-nuclio
    namespace: kube-system
    sectionName: db-ro-https
  rules:
  - backendRefs:
    - name: auth-postgrest
      port: 3000
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replaceFullPath: /
          type: ReplaceFullPath
    matches:
    - method: GET
      path:
        type: Exact
        value: /auth
    - method: GET
      path:
        type: Exact
        value: /auth/
    - method: HEAD
      path:
        type: Exact
        value: /auth
    - method: HEAD
      path:
        type: Exact
        value: /auth/
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: re8ch-auth-postgrest-readiness
  namespace: auth
spec:
  hostnames:
  - db-rw.re8ch.com
  - db-ro.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: db-rw-https
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: db-ro-https
  - name: re8ch-region-loudi
    namespace: kube-system
    sectionName: db-rw-https
  - name: re8ch-region-loudi
    namespace: kube-system
    sectionName: db-ro-https
  - name: re8ch-region-guangzhou
    namespace: kube-system
    sectionName: db-rw-https
  - name: re8ch-region-guangzhou
    namespace: kube-system
    sectionName: db-ro-https
  - name: re8ch-region-shanghai
    namespace: kube-system
    sectionName: db-rw-https
  - name: re8ch-region-shanghai
    namespace: kube-system
    sectionName: db-ro-https
  - name: re8ch-region-hangzhou-nuclio
    namespace: kube-system
    sectionName: db-rw-https
  - name: re8ch-region-hangzhou-nuclio
    namespace: kube-system
    sectionName: db-ro-https
  - name: re8ch-region-shanghai-nuclio
    namespace: kube-system
    sectionName: db-rw-https
  - name: re8ch-region-shanghai-nuclio
    namespace: kube-system
    sectionName: db-ro-https
  rules:
  - backendRefs:
    - name: auth-postgrest
      port: 3001
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replaceFullPath: /ready
          type: ReplaceFullPath
    matches:
    - method: GET
      path:
        type: Exact
        value: /auth/ready
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: re8ch-auth-postgrest-rpc-rw
  namespace: auth
spec:
  hostnames:
  - db-rw.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: db-rw-https
  - name: re8ch-region-loudi
    namespace: kube-system
    sectionName: db-rw-https
  - name: re8ch-region-guangzhou
    namespace: kube-system
    sectionName: db-rw-https
  - name: re8ch-region-shanghai
    namespace: kube-system
    sectionName: db-rw-https
  - name: re8ch-region-hangzhou-nuclio
    namespace: kube-system
    sectionName: db-rw-https
  - name: re8ch-region-shanghai-nuclio
    namespace: kube-system
    sectionName: db-rw-https
  rules:
  - backendRefs:
    - name: auth-postgrest
      port: 3000
    filters:
    - type: URLRewrite
      urlRewrite:
