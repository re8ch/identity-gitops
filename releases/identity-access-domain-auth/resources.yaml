---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: re8ch-supabase-auth
  namespace: auth
spec:
  hostnames:
  - auth.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: auth-https
  rules:
  - backendRefs:
    - name: supabase-identity-auth
      namespace: supabase-identity
      port: 9999
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /auth/v1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: re8ch-user-center
  namespace: auth
spec:
  hostnames:
  - auth.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: auth-https
  rules:
  - backendRefs:
    - name: re8ch-auth-gateway
      port: 8080
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replaceFullPath: /.well-known/openid-configuration
          type: ReplaceFullPath
    matches:
    - path:
        type: Exact
        value: /.well-known/oauth-authorization-server
  - backendRefs:
    - name: re8ch-auth-gateway
      port: 8080
    filters:
    - responseHeaderModifier:
        set:
        - name: X-Re8ch-Identity-Plane
          value: stalwart-broker
      type: ResponseHeaderModifier
    matches:
    - path:
        type: Exact
        value: /.well-known/openid-configuration
    - path:
        type: Exact
        value: /jwks
    - path:
        type: Exact
        value: /authorize
    - path:
        type: Exact
        value: /token
    - path:
        type: Exact
        value: /userinfo
    - path:
        type: Exact
        value: /start
    - path:
        type: PathPrefix
        value: /callback
    - path:
        type: PathPrefix
        value: /auth
  - backendRefs:
    - name: re8ch-user-center
      port: 80
    filters:
    - responseHeaderModifier:
        set:
        - name: X-Re8ch-Gateway
          value: cilium
      type: ResponseHeaderModifier
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: re8ch-user-center-http-redirect
  namespace: auth
spec:
  hostnames:
  - auth.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: http
  rules:
  - filters:
    - requestRedirect:
        scheme: https
        statusCode: 308
      type: RequestRedirect
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
    external-dns.alpha.kubernetes.io/hostname: auth-origin.re8ch.com
    external-dns.alpha.kubernetes.io/target: 223.159.210.222
    external-dns.alpha.kubernetes.io/ttl: '60'
    networking.re8ch.com/provider: public-edge-manager
  labels:
    networking.re8ch.com/dns-authority: public-edge
  name: re8ch-user-center-origin-dns
  namespace: auth
spec:
  ingressClassName: external-dns-only
  rules:
  - host: auth-origin.re8ch.com
    http:
      paths:
      - backend:
          service:
            name: re8ch-user-center
            port:
              number: 80
        path: /
        pathType: Prefix
