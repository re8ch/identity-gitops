---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stalwart-cloudflare-token-source
  namespace: qianwen-ops
rules:
- apiGroups:
  - ''
  resourceNames:
  - cloudflare-pg-dns-controller-secret
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stalwart-cloudflare-token-source
  namespace: qianwen-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stalwart-cloudflare-token-source
subjects:
- kind: ServiceAccount
  name: stalwart-cloudflare-token-sync
  namespace: mail-system
