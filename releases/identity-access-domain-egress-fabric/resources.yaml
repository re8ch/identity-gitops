---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: edge-access-anytls
  namespace: egress-fabric
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-access-anytls
  template:
    metadata:
      labels:
        app.kubernetes.io/component: public-ingress
        app.kubernetes.io/name: edge-access-anytls
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - -d
        - /etc/mihomo
        image: docker.io/metacubex/mihomo:v1.19.29@sha256:e1d7dadaa9368a52d420d65007e0e0d87cb148d292faa67326eda3fef5757f59
        livenessProbe:
          periodSeconds: 15
          tcpSocket:
            port: anytls
        name: mihomo
        ports:
        - containerPort: 24443
          name: anytls
          protocol: TCP
        readinessProbe:
          periodSeconds: 5
          tcpSocket:
            port: anytls
        resources:
          limits:
            cpu: 800m
            memory: 512Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /etc/mihomo/config.yaml
          name: work
          readOnly: true
          subPath: config.yaml
        - mountPath: /etc/mihomo/tls
          name: tls
          readOnly: true
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      initContainers:
      - args:
        - 'awk ''/^__ANYTLS_USERS__$/{while((getline line < "/credentials/users.yaml")>0)
          print line; close("/credentials/users.yaml"); next} {print}'' /base/config.yaml
          > /work/config.yaml

          '
        command:
        - /bin/sh
        - -ec
        image: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
        name: render-users
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /base
          name: base
          readOnly: true
        - mountPath: /credentials
          name: credentials
          readOnly: true
        - mountPath: /work
          name: work
      nodeSelector:
        networking.re8ch.com/edge-access-anytls: enabled
      priorityClassName: system-node-critical
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - operator: Exists
      volumes:
      - configMap:
          name: edge-access-anytls
        name: base
      - name: credentials
        secret:
          secretName: personal-access-users
      - name: tls
        secret:
          secretName: access-re8ch-com-tls
      - emptyDir: {}
        name: work
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-adguard
  namespace: egress-fabric
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: access-adguard
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        access.re8ch.com/config-revision: 20260827-1
      labels:
        app.kubernetes.io/name: access-adguard
        app.kubernetes.io/part-of: access-dns
        scheduling.re8ch.com/control-plane-allowed: 'true'
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --no-check-update
        - -c
        - /opt/adguardhome/conf/AdGuardHome.yaml
        - -w
        - /opt/adguardhome/work
        image: docker.io/adguard/adguardhome:v0.107.76@sha256:904e081ea2d67fc6440696960eac009c0f649a5eabf44da409dfc36c8b3304c9
        livenessProbe:
          periodSeconds: 15
          tcpSocket:
            port: dns-tcp
        name: adguard
        ports:
        - containerPort: 5353
          name: dns-udp
          protocol: UDP
        - containerPort: 5353
          name: dns-tcp
          protocol: TCP
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          periodSeconds: 5
          tcpSocket:
            port: dns-tcp
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /opt/adguardhome/work
          name: data
          subPath: work
        - mountPath: /opt/adguardhome/conf
          name: data
          subPath: conf
      initContainers:
      - args:
        - "import socket, time\ntarget = (\"mosdns.egress-fabric.svc.cluster.local\"\
          , 5353)\nfor attempt in range(60):\n    try:\n        socket.create_connection(target,\
          \ 2).close()\n        break\n    except OSError:\n        if attempt ==\
          \ 59:\n            raise\n        time.sleep(2)\n"
        command:
        - python
        - -c
        image: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
        name: wait-mosdns
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      - args:
        - from pathlib import Path; (Path('/data/work')).mkdir(parents=True,exist_ok=True);
          (Path('/data/conf')).mkdir(parents=True,exist_ok=True); Path('/data/conf/AdGuardHome.yaml').write_bytes(Path('/template/AdGuardHome.yaml').read_bytes())
        command:
        - python
        - -c
        image: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
        name: initialize
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /template
          name: config
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: r640
      priorityClassName: system-cluster-critical
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: access-adguard-data
      - configMap:
          name: access-dns-config
        name: config
