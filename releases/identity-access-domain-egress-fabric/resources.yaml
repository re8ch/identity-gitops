    STATE_CONFIGMAP\", \"access-subscription-devices\")\nAUTH_NAME = os.getenv(\"\
    AUTH_CONFIGMAP\", \"access-members-cache\")\nUSAGE_NAME = os.getenv(\"USAGE_CONFIGMAP\"\
