apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/component: channel-registry
  name: secretary-channel-registry-v2
  namespace: re8ch-secretary
spec:
  backoffLimit: 8
  template:
    metadata:
      labels:
        app.kubernetes.io/component: channel-registry
    spec:
      containers:
      - command:
        - python
        - -m
        - secretary.register_channels
        env:
        - name: SECRETARY_CHANNEL_REGISTRY
          valueFrom:
            configMapKeyRef:
              key: channels.json
              name: secretary-channel-registry-v1
        - name: SECRETARY_API_URL
          value: http://secretary-api
        - name: SECRETARY_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              key: webhook-secret
              name: secretary-runtime
        image: registry.re8ch.com/secretary-system/secretary-system@sha256:7101b40a67eac49a6d4cc0045660dd457d42887c5f6491c788ef136adebfd3fb
        name: register
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: secretary
---
apiVersion: batch/v1
kind: Job
metadata:
  name: secretary-register-v0-3-3
  namespace: re8ch-secretary
spec:
  backoffLimit: 8
  template:
    spec:
      containers:
      - args:
        - "import json,time,urllib.request\nurl='http://restate:9070/deployments'\n\
          body=json.dumps({'uri':'http://secretary-runtime:9080'}).encode()\nfor attempt\
          \ in range(60):\n    try:\n        request=urllib.request.Request(url,data=body,method='POST',headers={'Content-Type':'application/json'})\n\
          \        urllib.request.urlopen(request,timeout=5).read(); break\n    except\
          \ Exception:\n        if attempt == 59: raise\n        time.sleep(2)\n"
        command:
        - python
        - -c
        image: registry.re8ch.com/secretary-system/secretary-system@sha256:7101b40a67eac49a6d4cc0045660dd457d42887c5f6491c788ef136adebfd3fb
        name: register
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: cilium.io/v2
