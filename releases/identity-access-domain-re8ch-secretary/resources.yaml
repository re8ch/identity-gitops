apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: secretary-channel-webhooks
  namespace: re8ch-secretary
spec:
  hostnames:
  - tools.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: tools-https
  rules:
  - backendRefs:
    - name: secretary-api
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /v1/channels/
  - backendRefs:
    - name: secretary-api
      port: 80
    matches:
    - path:
        type: Exact
        value: /v1/event-stream
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: secretary-headlamp-read
  namespace: re8ch-secretary
spec:
  hostnames:
  - headlamp.service.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: service-wildcard-https
  rules:
  - backendRefs:
    - name: secretary-api
      port: 80
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replaceFullPath: /v1/headlamp/event-stream
          type: ReplaceFullPath
    matches:
    - path:
        type: Exact
        value: /secretary-api/v1/event-stream
  - backendRefs:
    - name: secretary-api
      port: 80
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replaceFullPath: /v1/headlamp/delivery-summary
          type: ReplaceFullPath
    matches:
    - path:
        type: Exact
        value: /secretary-api/v1/delivery-summary
  - backendRefs:
    - name: secretary-api
      port: 80
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replaceFullPath: /v1/headlamp/topology
          type: ReplaceFullPath
    matches:
    - path:
        type: Exact
        value: /secretary-api/v1/topology
  - backendRefs:
    - name: secretary-api
      port: 80
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replaceFullPath: /v1/headlamp/discrepancies
          type: ReplaceFullPath
    matches:
    - path:
        type: Exact
        value: /secretary-api/v1/discrepancies
