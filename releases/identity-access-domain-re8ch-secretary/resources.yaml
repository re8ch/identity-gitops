---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secretary-api
  namespace: re8ch-secretary
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: secretary-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secretary-api
    spec:
      containers:
      - command:
        - uvicorn
        - secretary.api:app
        - --host
        - 0.0.0.0
        - --port
        - '8081'
        env:
        - name: RESTATE_INGRESS_URL
          value: http://restate:8080
        - name: SECRETARY_DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL_RW
              name: secretary-db-credentials
        - name: SECRETARY_DATABASE_HOST_OVERRIDE
          value: pgwrite.pigsty-external.svc.cluster.local
        - name: SECRETARY_DATABASE_PORT_OVERRIDE
          value: '5432'
        - name: SECRETARY_INTERACTION_MODE
          value: shadow
        - name: SECRETARY_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              key: webhook-secret
              name: secretary-runtime
        - name: SECRETARY_QUERY_TOKEN
          valueFrom:
            secretKeyRef:
              key: query-token
              name: secretary-runtime
        - name: BLUEBUBBLES_WEBHOOK_TOKEN
          valueFrom:
            secretKeyRef:
              key: bluebubbles-webhook-token
              name: secretary-runtime
        - name: VOICE_WEBHOOK_TOKEN
          valueFrom:
            secretKeyRef:
              key: voice-webhook-token
              name: secretary-runtime
        - name: SECRETARY_IDENTITY_BINDINGS
          valueFrom:
            secretKeyRef:
              key: identity-bindings-json
              name: secretary-runtime
        - name: SECRETARY_PUBLIC_BASE_URL
          value: https://tools.re8ch.com
        - name: SMTP_HOST
          value: stalwart.mail-system.svc.cluster.local
        - name: SMTP_PORT
          value: '587'
        - name: SMTP_STARTTLS
          value: 'true'
        - name: SMTP_FROM
          valueFrom:
            secretKeyRef:
              key: email
              name: secretary-email
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: secretary-email
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: secretary-email
        - name: SMTP_TLS_FINGERPRINT_SHA256
          valueFrom:
            secretKeyRef:
              key: tls-fingerprint-sha256
              name: secretary-email
        - name: SECRETARY_NOTIFY_TO
          valueFrom:
            secretKeyRef:
              key: recipient
              name: secretary-email
        - name: SECRETARY_NOTIFY_RECIPIENT_ID
          valueFrom:
            secretKeyRef:
              key: recipient-id
              name: secretary-email
        - name: SECRETARY_ACK_TIMEOUT_SECONDS
          value: '900'
        image: registry.re8ch.com/secretary-system/secretary-system@sha256:7101b40a67eac49a6d4cc0045660dd457d42887c5f6491c788ef136adebfd3fb
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        name: api
        ports:
        - containerPort: 8081
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 6
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      initContainers:
      - args:
        - import os; from secretary.ledger import PostgresLedger; PostgresLedger(os.environ['SECRETARY_DATABASE_URL']).migrate()
        command:
        - python
        - -c
        env:
        - name: SECRETARY_DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL_MIGRATOR
              name: secretary-db-credentials
        - name: SECRETARY_DATABASE_HOST_OVERRIDE
          value: pgwrite.pigsty-external.svc.cluster.local
        - name: SECRETARY_DATABASE_PORT_OVERRIDE
          value: '5432'
        image: registry.re8ch.com/secretary-system/secretary-system@sha256:7101b40a67eac49a6d4cc0045660dd457d42887c5f6491c788ef136adebfd3fb
        name: migrate
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      nodeSelector:
        kubernetes.io/hostname: r640
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: secretary
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secretary-cluster-watcher
  namespace: re8ch-secretary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secretary-cluster-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secretary-cluster-watcher
    spec:
      containers:
      - command:
        - python
        - -m
        - secretary.cluster_watcher
        env:
        - name: SECRETARY_API_URL
          value: http://secretary-api/v1/observations
        - name: SECRETARY_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              key: webhook-secret
              name: secretary-runtime
        - name: SECRETARY_NOTIFY_TO
          valueFrom:
            secretKeyRef:
              key: recipient
              name: secretary-email
        - name: SECRETARY_NOTIFY_RECIPIENT_ID
          valueFrom:
            secretKeyRef:
              key: recipient-id
              name: secretary-email
        - name: SECRETARY_PUBLIC_PROBES_JSON
          value: '[{"name":"harbor","url":"https://registry.re8ch.com/api/v2.0/health","severity":"high","failure_threshold":3},{"name":"stalwart-jmap","url":"https://id.re8ch.com/.well-known/jmap","severity":"high","failure_threshold":3}]'
        image: registry.re8ch.com/secretary-system/secretary-system@sha256:7101b40a67eac49a6d4cc0045660dd457d42887c5f6491c788ef136adebfd3fb
        name: watcher
        resources:
          limits:
            cpu: 200m
            memory: 192Mi
          requests:
            cpu: 20m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      nodeSelector:
        kubernetes.io/hostname: r640
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: secretary-cluster-observer
