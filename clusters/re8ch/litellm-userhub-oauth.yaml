apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-oauth-clients-litellm-v1
  namespace: supabase-identity
data:
  clients.sql: |
    begin;
    insert into auth.oauth_clients (
      id, client_secret_hash, registration_type, client_type,
      token_endpoint_auth_method, redirect_uris, grant_types,
      client_name, client_uri
    ) values (
      '42c43a54-39d4-523b-b76f-2045b9a7311a',
      translate(rtrim(encode(digest(:'client_secret', 'sha256'), 'base64'), '='), '+/', '-_'),
      'manual', 'confidential',
      'client_secret_basic', 'https://litellm.service.re8ch.com/sso/callback',
      'authorization_code,refresh_token', 'RE8CH LiteLLM',
      'https://litellm.service.re8ch.com'
    ) on conflict (id) do update set
      client_secret_hash = excluded.client_secret_hash,
      registration_type = excluded.registration_type,
      client_type = excluded.client_type,
      token_endpoint_auth_method = excluded.token_endpoint_auth_method,
      redirect_uris = excluded.redirect_uris,
      grant_types = excluded.grant_types,
      client_name = excluded.client_name,
      client_uri = excluded.client_uri,
      deleted_at = null,
      updated_at = now();
    select 1 / case when exists (
      select 1 from auth.oauth_clients
      where id = '42c43a54-39d4-523b-b76f-2045b9a7311a'
        and client_secret_hash = translate(rtrim(encode(digest(:'client_secret', 'sha256'), 'base64'), '='), '+/', '-_')
        and client_type = 'confidential'
        and token_endpoint_auth_method = 'client_secret_basic'
        and redirect_uris = 'https://litellm.service.re8ch.com/sso/callback'
        and deleted_at is null
    ) then 1 else 0 end;
    commit;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: supabase-oauth-clients-litellm-v1
  namespace: supabase-identity
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: register
          image: postgres:16.9-alpine
          command: [/bin/sh, -ceu]
          args:
            - psql -X -v ON_ERROR_STOP=1 -v client_secret="$LITELLM_CLIENT_SECRET" "$GOTRUE_DB_DATABASE_URL" -f /sql/clients.sql
          env:
            - name: GOTRUE_DB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: supabase-identity-secrets
                  key: GOTRUE_DB_DATABASE_URL
            - name: LITELLM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litellm-gotrue-sso
                  key: client-secret
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: sql
          configMap:
            name: supabase-oauth-clients-litellm-v1
