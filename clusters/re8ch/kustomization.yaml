apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- resources.yaml
- cube-userhub-oauth.yaml
- grafana-userhub-oauth.yaml
- stalwart-userhub-oauth.yaml
- payments-authority-resources.yaml
- supabase-pg-re8ch-authority-resources.yaml
patches:
- target: {group: apps, version: v1, kind: Deployment, name: hyperswitch-web, namespace: payments}
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: hyperswitch-web, namespace: payments}
    $patch: delete
- target: {version: v1, kind: ConfigMap, name: hyperswitch-superposition-schema, namespace: payments}
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: hyperswitch-superposition-schema, namespace: payments}
    $patch: delete
- target: {version: v1, kind: ConfigMap, name: hyperswitch-superposition-seed, namespace: payments}
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: hyperswitch-superposition-seed, namespace: payments}
    $patch: delete
- target: {version: v1, kind: Service, name: hyperswitch-web, namespace: payments}
  patch: |-
    apiVersion: v1
    kind: Service
    metadata: {name: hyperswitch-web, namespace: payments}
    $patch: delete
- target: {group: gateway.networking.k8s.io, version: v1, kind: HTTPRoute, name: hyperswitch-control-center-public, namespace: payments}
  patch: |-
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata: {name: hyperswitch-control-center-public, namespace: payments}
    $patch: delete
- target: {group: gateway.networking.k8s.io, version: v1, kind: HTTPRoute, name: hyperswitch-router-public, namespace: payments}
  patch: |-
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata: {name: hyperswitch-router-public, namespace: payments}
    $patch: delete
- target: {group: gateway.networking.k8s.io, version: v1, kind: HTTPRoute, name: hyperswitch-web-public, namespace: payments}
  patch: |-
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata: {name: hyperswitch-web-public, namespace: payments}
    $patch: delete
