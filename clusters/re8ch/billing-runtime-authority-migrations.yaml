apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/component: schema-migration
    app.kubernetes.io/part-of: supabase-billing
  name: supabase-billing-org-cluster-bindings-v1
  namespace: supabase-pg-re8ch
spec:
  backoffLimit: 4
  template:
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - psql -X -v ON_ERROR_STOP=1 -f /sql/migration.sql
        command:
        - /bin/sh
        - -ceu
        env:
        - name: PGHOST
          value: pg-re8ch-primary.pigsty-external.svc.cluster.local
        - name: PGPORT
          value: '5432'
        - name: PGDATABASE
          value: re8ch_billing
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER_READ_WRITE
              name: supabase-pg-re8ch-secrets
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: supabase-pg-re8ch-secrets
        image: docker.io/library/postgres@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        name: migrate
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /sql
          name: sql
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: r640
      restartPolicy: Never
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: supabase-billing-schema-migrator
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: pg-re8ch
      volumes:
      - configMap:
          name: supabase-billing-org-cluster-bindings-v1
        name: sql
  ttlSecondsAfterFinished: 604800
