{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "supabase-oauth-clients-stalwart-v1",
    "namespace": "supabase-identity"
  },
  "data": {
    "clients.sql": "begin;\ninsert into auth.oauth_clients (id, client_secret_hash, registration_type, client_type, token_endpoint_auth_method, redirect_uris, grant_types, client_name, client_uri)\nvalues ('705c1168-43d8-4ec3-980a-0327a59c7fc6', '', 'manual', 'public', 'none', 'https://mail.re8ch.com/auth/callback,https://mail.re8ch.com/ar/auth/callback,https://mail.re8ch.com/ca/auth/callback,https://mail.re8ch.com/cs/auth/callback,https://mail.re8ch.com/da/auth/callback,https://mail.re8ch.com/de/auth/callback,https://mail.re8ch.com/en/auth/callback,https://mail.re8ch.com/es/auth/callback,https://mail.re8ch.com/fa/auth/callback,https://mail.re8ch.com/fr/auth/callback,https://mail.re8ch.com/he/auth/callback,https://mail.re8ch.com/hu/auth/callback,https://mail.re8ch.com/it/auth/callback,https://mail.re8ch.com/ja/auth/callback,https://mail.re8ch.com/ko/auth/callback,https://mail.re8ch.com/lv/auth/callback,https://mail.re8ch.com/mn/auth/callback,https://mail.re8ch.com/nb/auth/callback,https://mail.re8ch.com/nl/auth/callback,https://mail.re8ch.com/pl/auth/callback,https://mail.re8ch.com/pt/auth/callback,https://mail.re8ch.com/ro/auth/callback,https://mail.re8ch.com/ru/auth/callback,https://mail.re8ch.com/sk/auth/callback,https://mail.re8ch.com/tr/auth/callback,https://mail.re8ch.com/uk/auth/callback,https://mail.re8ch.com/zh/auth/callback,https://mail.re8ch.com/zh-TW/auth/callback', 'authorization_code,refresh_token', 'RE8CH Mail', 'https://mail.re8ch.com')\non conflict (id) do update set client_secret_hash=excluded.client_secret_hash, registration_type=excluded.registration_type, client_type=excluded.client_type, token_endpoint_auth_method=excluded.token_endpoint_auth_method, redirect_uris=excluded.redirect_uris, grant_types=excluded.grant_types, client_name=excluded.client_name, client_uri=excluded.client_uri, deleted_at=null, updated_at=now();\nselect id, client_name, client_type from auth.oauth_clients where id='705c1168-43d8-4ec3-980a-0327a59c7fc6' and deleted_at is null;\ncommit;\n"
  }
}
---
{
  "apiVersion": "batch/v1",
  "kind": "Job",
  "metadata": {
    "name": "supabase-oauth-clients-stalwart-v1",
    "namespace": "supabase-identity"
  },
  "spec": {
    "backoffLimit": 1,
    "template": {
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "args": [
              "psql -X -v ON_ERROR_STOP=1 \"$GOTRUE_DB_DATABASE_URL\" -f /sql/clients.sql"
            ],
            "command": [
              "/bin/sh",
              "-ceu"
            ],
            "env": [
              {
                "name": "GOTRUE_DB_DATABASE_URL",
                "valueFrom": {
                  "secretKeyRef": {
                    "key": "GOTRUE_DB_DATABASE_URL",
                    "name": "supabase-identity-secrets"
                  }
                }
              }
            ],
            "image": "postgres:16.9-alpine",
            "name": "register",
            "resources": {
              "limits": {
                "cpu": "250m",
                "memory": "128Mi"
              },
              "requests": {
                "cpu": "10m",
                "memory": "32Mi"
              }
            },
            "volumeMounts": [
              {
                "mountPath": "/sql",
                "name": "sql",
                "readOnly": true
              }
            ]
          }
        ],
        "nodeSelector": {
          "kubernetes.io/hostname": "r640"
        },
        "restartPolicy": "Never",
        "tolerations": [
          {
            "effect": "NoSchedule",
            "key": "dedicated",
            "operator": "Equal",
            "value": "pg-re8ch"
          }
        ],
        "volumes": [
          {
            "configMap": {
              "name": "supabase-oauth-clients-stalwart-v1"
            },
            "name": "sql"
          }
        ]
      }
    },
    "ttlSecondsAfterFinished": 604800,
    "activeDeadlineSeconds": 120
  }
}
---
{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "stalwart-userhub-oauth-plan-v1",
    "namespace": "mail-system"
  },
  "data": {
    "plan.ndjson": "{\"@type\":\"upsert\",\"object\":\"Directory\",\"matchOn\":[\"description\"],\"value\":{\"re8ch-enterprise-sso\":{\"@type\":\"Oidc\",\"description\":\"RE8CH Enterprise SSO broker\",\"issuerUrl\":\"https://auth.re8ch.com\",\"acceptedAudiences\":{\"stalwart-webui\":true},\"unscopedTokens\":\"interoperable\",\"claimUsername\":\"email\",\"claimName\":\"name\",\"claimGroups\":\"groups\"}}}\n{\"@type\":\"upsert\",\"object\":\"Domain\",\"matchOn\":[\"name\"],\"value\":{\"re8ch-domain\":{\"name\":\"re8ch.com\",\"enable\":true,\"aliases\":{},\"certificateManagement\":{\"@type\":\"Manual\"},\"dkimManagement\":{\"@type\":\"Automatic\"},\"dnsManagement\":{\"@type\":\"Manual\"},\"subAddressing\":{\"@type\":\"Enabled\"},\"directoryId\":\"#re8ch-enterprise-sso\"}}}\n{\"@type\":\"update\",\"object\":\"Authentication\",\"value\":{\"directoryId\":\"#re8ch-enterprise-sso\"}}\n"
  }
}
---
{
  "apiVersion": "batch/v1",
  "kind": "Job",
  "metadata": {
    "labels": {
      "app.kubernetes.io/name": "stalwart-unified-identity-bootstrap",
      "governance.re8ch.com/change-plane": "deploying"
    },
    "name": "stalwart-userhub-oauth-v8",
    "namespace": "mail-system"
  },
  "spec": {
    "backoffLimit": 1,
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "stalwart-unified-identity-bootstrap"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "args": [
              "export STALWART_URL=http://stalwart.mail-system.svc.cluster.local:8080\nexport STALWART_USER=\"${STALWART_RECOVERY_ADMIN%%:*}\"\nexport STALWART_PASSWORD=\"${STALWART_RECOVERY_ADMIN#*:}\"\nunset STALWART_RECOVERY_ADMIN\ncli=/cli/usr/local/bin/stalwart-cli\nfor attempt in $(seq 1 30); do\n  if \"${cli}\" describe Authentication >/dev/null 2>&1; then break; fi\n  if [ \"${attempt}\" -eq 30 ]; then exit 1; fi\n  sleep 2\ndone\n\"${cli}\" apply --file /plan/plan.ndjson --dry-run\n\"${cli}\" apply --file /plan/plan.ndjson --json\n"
            ],
            "command": [
              "/bin/sh",
              "-ceu"
            ],
            "env": [
              {
                "name": "XDG_CACHE_HOME",
                "value": "/cache"
              }
            ],
            "envFrom": [
              {
                "secretRef": {
                  "name": "stalwart-recovery-admin"
                }
              }
            ],
            "image": "alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659",
            "name": "reconcile",
            "resources": {
              "limits": {
                "cpu": "500m",
                "memory": "256Mi"
              },
              "requests": {
                "cpu": "25m",
                "memory": "48Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "readOnlyRootFilesystem": true
            },
            "volumeMounts": [
              {
                "mountPath": "/plan",
                "name": "plan",
                "readOnly": true
              },
              {
                "mountPath": "/cli",
                "name": "cli",
                "readOnly": true
              },
              {
                "mountPath": "/cache",
                "name": "cache"
              }
            ]
          }
        ],
        "nodeSelector": {
          "kubernetes.io/hostname": "r640"
        },
        "restartPolicy": "Never",
        "securityContext": {
          "runAsGroup": 65532,
          "runAsNonRoot": true,
          "runAsUser": 65532,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "volumes": [
          {
            "configMap": {
              "name": "stalwart-userhub-oauth-plan-v1"
            },
            "name": "plan"
          },
          {
            "emptyDir": {},
            "name": "cache"
          },
          {
            "image": {
              "pullPolicy": "IfNotPresent",
              "reference": "ghcr.io/stalwartlabs/cli@sha256:5b70732cb69cdab3ff0894c501544cf0bfa180fa75bcd0eeba4eebe04c1064e1"
            },
            "name": "cli"
          }
        ]
      }
    },
    "ttlSecondsAfterFinished": 604800,
    "activeDeadlineSeconds": 600
  }
}
