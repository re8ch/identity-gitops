apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    governance.re8ch.com/exposure: stalwart-admin-authentication-required
  name: stalwart-admin-public
  namespace: mail-system
spec:
  hostnames:
  - stalwart-admin.service.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: service-wildcard-https
  rules:
  - filters:
    - requestRedirect:
        path:
          replaceFullPath: /admin
          type: ReplaceFullPath
        statusCode: 302
      type: RequestRedirect
    matches:
    - path:
        type: Exact
        value: /
  - backendRefs:
    - name: stalwart
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /admin
    - path:
        type: PathPrefix
        value: /api
    - path:
        type: PathPrefix
        value: /jmap
    - path:
        type: Exact
        value: /login
    - path:
        type: PathPrefix
        value: /auth
    - path:
        type: PathPrefix
        value: /.well-known
