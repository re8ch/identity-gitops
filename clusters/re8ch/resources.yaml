apiVersion: v1
data:
  AdGuardHome.yaml: "http:\n  address: 0.0.0.0:3000\n  session_ttl: 720h\nusers: []\n\
    auth_attempts: 5\nblock_auth_min: 15\ndns:\n  bind_hosts: [0.0.0.0]\n  port: 5353\n\
    \  ratelimit: 200\n  refuse_any: true\n  # AdGuard's upstream bootstrap resolver\
    \ cannot resolve cluster.local.\n  # This Service IP is explicitly reserved below\
    \ and verified by GitOps.\n  upstream_dns: [10.43.66.51:5353]\n  bootstrap_dns:\
    \ [223.5.5.5, 119.29.29.29]\n  cache_size: 4194304\n  cache_ttl_min: 60\n  cache_ttl_max:\
    \ 86400\nfiltering:\n  filtering_enabled: true\n  filters_update_interval: 24\n\
    filters:\n  - enabled: true\n    url: https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt\n\
    \    name: AdGuard DNS filter\n    id: 1\nquerylog:\n  enabled: true\n  file_enabled:\
    \ true\n  interval: 24h\n  size_memory: 1000\n  anonymize_client_ip: false\nstatistics:\
    \ {enabled: true, interval: 24h}\nschema_version: 30\n"
  mosdns.yaml: "log: {level: info, production: true}\nplugins:\n  - tag: cache\n \
    \   type: cache\n    args: {size: 65536, lazy_cache_ttl: 86400}\n  - tag: private_domains\n\
    \    type: domain_set\n    args: {files: [/rules/current/private-domains.txt]}\n\
    \  - tag: cn_domains\n    type: domain_set\n    args: {files: [/rules/current/cn-domains.txt]}\n\
    \  - tag: forward_cn\n    type: forward\n    args:\n      concurrent: 2\n    \
    \  upstreams:\n        - {addr: https://dns.alidns.com/dns-query, dial_addr: 223.5.5.5}\n\
    \        - {addr: https://doh.pub/dns-query, dial_addr: 119.29.29.29}\n  - tag:\
    \ forward_global\n    type: forward\n    args:\n      concurrent: 2\n      upstreams:\n\
    \        - {addr: https://1.1.1.1/dns-query, socks5: mihomos-node-cn-local:17891}\n\
    \        - {addr: https://dns.google/dns-query, dial_addr: 8.8.8.8, socks5: mihomos-node-cn-local:17891}\n\
    \  - tag: main_sequence\n    type: sequence\n    args:\n      - exec: $cache\n\
    \      - matches: has_resp\n        exec: accept\n      - matches: qname $private_domains\
    \ $cn_domains\n        exec: $forward_cn\n      - matches: has_resp\n        exec:\
    \ accept\n      - exec: $forward_global\n      - exec: $cache\n  - tag: udp_server\n\
    \    type: udp_server\n    args: {entry: main_sequence, listen: 0.0.0.0:5353}\n\
    \  - tag: tcp_server\n    type: tcp_server\n    args: {entry: main_sequence, listen:\
    \ 0.0.0.0:5353}\n"
