kind: ConfigMap
metadata:
  name: stalwart-idp-config
  namespace: mail-system
---
apiVersion: v1
data:
  provision.py: "import base64\nimport datetime\nimport json\nimport os\nimport secrets\n\
    import ssl\nimport subprocess\nimport urllib.error\nimport urllib.request\n\n\
    API = \"https://kubernetes.default.svc\"\nTOKEN = open(\"/var/run/secrets/kubernetes.io/serviceaccount/token\"\
    , encoding=\"utf-8\").read().strip()\nCONTEXT = ssl.create_default_context(cafile=\"\
    /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\")\nCLI = \"/cli/usr/local/bin/stalwart-cli\"\
    \nACCOUNTS_PATH = \"/apis/governance.re8ch.com/v1alpha1/namespaces/git-workspaces/gitaccounts\"\
    \nSTALWART_ADMIN_MANAGED = {\n    \"re8ch-image-admin\", \"re8ch-cloud-admin\"\
    , \"re8ch-observability-admin\",\n    \"re8ch-ai-admin\", \"re8ch-business-admin\"\
    ,\n}\nrecovery_user, separator, recovery_password = os.environ.pop(\"STALWART_RECOVERY_ADMIN\"\
    ).partition(\":\")\nif separator != \":\" or not recovery_user or not recovery_password:\n\
    \    raise RuntimeError(\"invalid recovery credential reference\")\nos.environ[\"\
    STALWART_USER\"] = recovery_user\nos.environ[\"STALWART_PASSWORD\"] = recovery_password\n\
    \ndef kube(method, path, body=None, content_type=\"application/json\"):\n    payload\
    \ = None if body is None else json.dumps(body, separators=(\",\", \":\")).encode()\n\
    \    request = urllib.request.Request(\n        API + path,\n        data=payload,\n\
    \        method=method,\n        headers={\"Authorization\": \"Bearer \" + TOKEN,\
    \ \"Content-Type\": content_type},\n    )\n    try:\n        with urllib.request.urlopen(request,\
    \ context=CONTEXT, timeout=20) as response:\n            return json.load(response)\
    \ if response.length != 0 else {}\n    except urllib.error.HTTPError as error:\n\
    \        if error.code == 404:\n            return None\n        raise\n\ndef\
    \ cli(*arguments, stdin=None, env=None):\n    result = subprocess.run(\n     \
    \   [CLI, *arguments], input=stdin, text=True, capture_output=True,\n        env=env\
    \ or os.environ, timeout=180, check=False,\n    )\n    if result.returncode:\n\
    \        raise RuntimeError(\"stalwart-cli failed without exposing credential\
    \ output\")\n    return result.stdout\n\ndef secret_name(account):\n    reference\
    \ = (((account.get(\"spec\") or {}).get(\"collaboration\") or {}).get(\"credentialSecretRef\"\
    ) or {})\n    if reference.get(\"namespace\") not in (None, \"mail-system\"):\n\
    \        raise RuntimeError(\"credential Secret must remain in mail-system\")\n\
    \    return reference.get(\"name\") or account[\"metadata\"][\"name\"] + \"-stalwart-credentials\"\
    \n\ndef load_or_create_password(account, email):\n    name = secret_name(account)\n\
    \    path = \"/api/v1/namespaces/mail-system/secrets/\" + name\n    current =\
    \ kube(\"GET\", path)\n    if current:\n        encoded = (current.get(\"data\"\
    ) or {}).get(\"password\")\n        if not encoded:\n            raise RuntimeError(\"\
    credential Secret exists without password\")\n        return base64.b64decode(encoded).decode()\n\
    \    password = secrets.token_urlsafe(32)\n    values = {\"email\": email, \"\
    username\": email, \"password\": password}\n    kube(\"POST\", \"/api/v1/namespaces/mail-system/secrets\"\
    , {\n        \"apiVersion\": \"v1\", \"kind\": \"Secret\",\n        \"metadata\"\
    : {\n            \"name\": name, \"namespace\": \"mail-system\",\n           \
    \ \"labels\": {\"app.kubernetes.io/managed-by\": \"stalwart-mailbox-provisioner\"\
    },\n            \"annotations\": {\"governance.re8ch.com/git-account\": account[\"\
    metadata\"][\"name\"]},\n        },\n        \"type\": \"Opaque\",\n        \"\
    data\": {key: base64.b64encode(value.encode()).decode() for key, value in values.items()},\n\
    \    })\n    return password\n\ndef retire_managed_password_copy(account):\n \
    \   name = secret_name(account)\n    path = \"/api/v1/namespaces/mail-system/secrets/\"\
    \ + name\n    current = kube(\"GET\", path)\n    if not current:\n        return\n\
    \    metadata = current.get(\"metadata\") or {}\n    if (metadata.get(\"labels\"\
    ) or {}).get(\"app.kubernetes.io/managed-by\") != \"stalwart-mailbox-provisioner\"\
    \ or (metadata.get(\"annotations\") or {}).get(\"governance.re8ch.com/git-account\"\
    ) != account[\"metadata\"][\"name\"]:\n        raise RuntimeError(\"refusing to\
    \ delete an unmanaged mailbox Secret\")\n    kube(\"DELETE\", path)\n\ndef patch_status(account,\
    \ phase, reason):\n    name = account[\"metadata\"][\"name\"]\n    now = datetime.datetime.now(datetime.timezone.utc).isoformat().replace(\"\
    +00:00\", \"Z\")\n    kube(\"PATCH\", ACCOUNTS_PATH + \"/\" + name + \"/status\"\
    , {\n        \"status\": {\"mailbox\": {\"phase\": phase, \"provider\": \"stalwart\"\
    , \"observedAt\": now, \"reason\": reason}}\n    }, \"application/merge-patch+json\"\
    )\n\naccounts = [\n    item for item in kube(\"GET\", ACCOUNTS_PATH)[\"items\"\
    ]\n    if (item.get(\"spec\") or {}).get(\"mailbox\") == \"stalwart\"\n]\ngroup_projects\
    \ = {\n    \"platform-shared\": {\n        \"advanced-fabric\", \"among-clusters\"\
    , \"brand-assets\", \"cloud-functions\", \"cluster-website\",\n        \"codex-admin-plugins\"\
    , \"connectool\", \"farseer\", \"headlamp-advanced-fabric\",\n        \"headlamp-birfucate\"\
    , \"image-website\", \"mihomos-cluster\", \"observable-website\",\n        \"\
    product-public-data\", \"re8ch-core\", \"registry-product-site\", \"service-backend\"\
    ,\n        \"tool-distribution\",\n    },\n    \"anycam-shared\": {\"anycam\"\
    , \"anycam-backend\", \"anycam-ios\", \"anycam-website\"},\n    \"anysiteonearth-shared\"\
    : {\"anysiteonearth\", \"anysiteonearth-website\"},\n    \"baozou-ppt-studio-shared\"\
    : {\"baozou-ppt-studio\", \"director-engines\"},\n    \"garageband-shared\": {\"\
    garageband-mcp\", \"garageband-mcp-site\"},\n    \"ledger-shared\": {\"ledger\"\
    , \"ledger-dashboard\", \"ledger-site\"},\n    \"phonaid-shared\": {\"phonaid-android\"\
    , \"phonaid-service\", \"phonaid-website\"},\n    \"re8ch-image-admins\": {\"\
    re8ch-image\"},\n    \"re8ch-cloud-admins\": {\"re8ch-cloud\"},\n    \"re8ch-observability-admins\"\
    : {\"re8ch-observability\"},\n    \"re8ch-ai-admins\": {\"re8ch-ai\"},\n    \"\
    re8ch-business-admins\": {\"re8ch-business\"},\n}\ndomain_rows = [json.loads(line)\
    \ for line in cli(\"query\", \"Domain\", \"--fields\", \"id,name\", \"--json\"\
    ).splitlines()]\ndomain = next((row for row in domain_rows if row.get(\"name\"\
    ) == \"phonaid.com\"), None)\nif not domain:\n    raise RuntimeError(\"phonaid.com\
    \ domain is not provisioned\")\n\ngroup_plan = []\nfor index, name in enumerate(group_projects):\n\
    \    group_plan.append({\n        \"@type\": \"upsert\", \"object\": \"Account\"\
    , \"matchOn\": [\"name\", \"domainId\"],\n        \"value\": {\"group-\" + str(index):\
    \ {\n            \"@type\": \"Group\", \"name\": name, \"domainId\": domain[\"\
    id\"],\n            \"description\": name.removesuffix(\"-shared\").replace(\"\
    -\", \" \").title() + \" shared workspace\",\n            \"roles\": {\"@type\"\
    : \"Default\"}, \"permissions\": {\"@type\": \"Inherit\"},\n            \"quotas\"\
    : {}, \"aliases\": {},\n        }},\n    })\ncli(\"apply\", \"--stdin\", \"--json\"\
    , stdin=\"\\n\".join(json.dumps(item) for item in group_plan) + \"\\n\")\ngroup_rows\
    \ = [json.loads(line) for line in cli(\"query\", \"Account\", \"--fields\", \"\
    id,name\", \"--json\").splitlines()]\ngroup_ids = {row[\"name\"]: row[\"id\"]\
    \ for row in group_rows if row.get(\"name\") in group_projects}\nif set(group_ids)\
    \ != set(group_projects):\n    raise RuntimeError(\"Stalwart group reconciliation\
    \ is incomplete\")\naccount_rows = [json.loads(line) for line in cli(\"query\"\
    , \"Account\", \"--fields\", \"id,name\", \"--json\").splitlines()]\nexisting_names\
    \ = {row[\"name\"] for row in account_rows}\n\n# Harry is the SSO-backed mailbox\
    \ owner and the canonical administrator.\n# Match both name and domain so a legacy\
    \ homonym cannot gain Admin rights.\nre8ch_domain = next((row for row in domain_rows\
    \ if row.get(\"name\") == \"re8ch.com\"), None)\nif not re8ch_domain:\n    raise\
    \ RuntimeError(\"re8ch.com domain is not provisioned\")\nharry_rows = [json.loads(line)\
    \ for line in cli(\n    \"query\", \"Account\", \"--fields\", \"id,name,domainId,roles,aliases\"\
    , \"--json\"\n).splitlines() if line.strip()]\nharry = [row for row in harry_rows\
    \ if row.get(\"name\") == \"harry\" and row.get(\"domainId\") == re8ch_domain[\"\
    id\"]]\nif len(harry) != 1 or not any(\n    alias.get(\"name\") == \"admin\" and\
    \ alias.get(\"domainId\") == re8ch_domain[\"id\"] and alias.get(\"enabled\")\n\
    \    for alias in (harry[0].get(\"aliases\") or {}).values()\n):\n    raise RuntimeError(\"\
    canonical Harry account or admin@re8ch.com alias is missing\")\nif harry[0].get(\"\
    roles\") != {\"@type\": \"Admin\"}:\n    cli(\"update\", \"Account\", harry[0][\"\
    id\"], \"--json\", '{\"roles\":{\"@type\":\"Admin\"}}')\n\n# The operator is harry@re8ch.com.\
    \ admin@re8ch.com is its Stalwart alias.\n# Do not recreate the retired phonaid\
    \ administrator on hourly runs.\nplan = []\npending = []\nmigrated = []\nfor index,\
    \ account in enumerate(accounts):\n    try:\n        email = account[\"spec\"\
    ][\"email\"]\n        local, separator, domain_name = email.partition(\"@\")\n\
    \        if separator != \"@\" or domain_name != \"phonaid.com\" or not local:\n\
    \            raise RuntimeError(\"invalid canonical mailbox address\")\n     \
    \   if account[\"metadata\"][\"name\"] in STALWART_ADMIN_MANAGED:\n          \
    \  previous = (account.get(\"status\") or {}).get(\"mailbox\") or {}\n       \
    \     legacy_copy = kube(\"GET\", \"/api/v1/namespaces/mail-system/secrets/\"\
    \ + secret_name(account))\n            if local not in existing_names or (legacy_copy\
    \ and (previous.get(\"phase\") != \"Ready\" or previous.get(\"provider\") != \"\
    stalwart\")):\n                patch_status(account, \"Failed\", \"StalwartAdminCredentialReviewRequired\"\
    )\n                continue\n            # Leave the Stalwart account and its\
    \ password untouched. Only\n            # the mail administrator may rotate its\
    \ credential from now on.\n            migrated.append(account)\n            continue\n\
    \        password = load_or_create_password(account, email)\n        project =\
    \ account[\"spec\"].get(\"project\")\n        memberships = {\n            group_ids[name]:\
    \ True for name, projects in group_projects.items() if project in projects\n \
    \       }\n        plan.append({\n            \"@type\": \"upsert\", \"object\"\
    : \"Account\", \"matchOn\": [\"name\", \"domainId\"],\n            \"value\":\
    \ {\"account-\" + str(index): {\n                \"@type\": \"User\", \"name\"\
    : local, \"domainId\": domain[\"id\"],\n                \"description\": account[\"\
    spec\"].get(\"displayName\") or account[\"metadata\"][\"name\"],\n           \
    \     \"credentials\": {\"0\": {\"@type\": \"Password\", \"secret\": password}},\n\
    \                \"roles\": {\"@type\": \"User\"}, \"permissions\": {\"@type\"\
    : \"Inherit\"},\n                \"memberGroupIds\": memberships, \"quotas\":\
    \ {}, \"aliases\": {},\n                \"encryptionAtRest\": {\"@type\": \"Disabled\"\
    },\n            }},\n        })\n        pending.append(account)\n    except Exception:\n\
    \        patch_status(account, \"Failed\", \"CredentialProvisioningFailed\")\n\
    \nlist_plan = []\nfor index, (group_name, projects) in enumerate(group_projects.items()):\n\
    \    list_name = group_name.removesuffix(\"-shared\") if group_name.endswith(\"\
    -shared\") else group_name + \"-mailing-list\"\n    recipients = {\n        account[\"\
    spec\"][\"email\"]: True for account in accounts\n        if account[\"spec\"\
    ].get(\"project\") in projects\n    }\n    list_plan.append({\n        \"@type\"\
    : \"upsert\", \"object\": \"MailingList\", \"matchOn\": [\"name\", \"domainId\"\
    ],\n        \"value\": {\"list-\" + str(index): {\n            \"name\": list_name,\
    \ \"domainId\": domain[\"id\"],\n            \"description\": list_name.replace(\"\
    -\", \" \").title() + \" maintainers\",\n            \"recipients\": recipients,\
    \ \"aliases\": {},\n        }},\n    })\nlist_plan.append({\n    \"@type\": \"\
    upsert\", \"object\": \"MailingList\", \"matchOn\": [\"name\", \"domainId\"],\n\
    \    \"value\": {\"list-all\": {\n        \"name\": \"maintainers\", \"domainId\"\
    : domain[\"id\"],\n        \"description\": \"All repository maintainers\",\n\
    \        \"recipients\": {account[\"spec\"][\"email\"]: True for account in accounts},\
    \ \"aliases\": {},\n    }},\n})\nplan.extend(list_plan)\nif plan:\n    try:\n\
    \        cli(\"apply\", \"--stdin\", \"--json\", stdin=\"\\n\".join(json.dumps(item)\
    \ for item in plan) + \"\\n\")\n        cli(\"create\", \"Action\", \"--json\"\
    , '{\"@type\":\"InvalidateCaches\"}')\n    except Exception:\n        for account\
    \ in pending:\n            patch_status(account, \"Failed\", \"StalwartApplyFailed\"\
    )\n        raise\n    for account in pending:\n        patch_status(account, \"\
    Ready\", \"PrincipalAndPasswordReady\")\nfor account in migrated:\n    try:\n\
    \        retire_managed_password_copy(account)\n        patch_status(account,\
    \ \"Ready\", \"StalwartAdminManaged\")\n    except Exception:\n        patch_status(account,\
    \ \"Failed\", \"CredentialCopyRetirementFailed\")\n        raise\nprint(json.dumps({\"\
    accounts\": len(accounts), \"ready\": len(pending) + len(migrated), \"stalwartManaged\"\
    : len(migrated)}))\n"
