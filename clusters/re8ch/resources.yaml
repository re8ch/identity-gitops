    {META}/geoip/cn.mrs\",\n    \"private-ip\": f\"{META}/geoip/private.mrs\",\n}\n\
    \nLIST_SOURCES = {\n    \"private\": [f\"{BM}/Lan/Lan.list\"],\n    \"cn\": [f\"\
    {BM}/ChinaMax/ChinaMax.list\"],\n    \"cn-ip\": [f\"{BM}/ChinaIPs/ChinaIPs.list\"\
    ],\n    \"adblock\": [f\"{BM}/AdvertisingLite/AdvertisingLite.list\"],\n    \"\
    direct-services\": [f\"{BM}/{name}/{name}.list\" for name in\n               \
    \         (\"Alibaba\", \"Baidu\", \"BiliBili\", \"ChinaMedia\", \"Tencent\",\
    \ \"Cloudflarecn\", \"SteamCN\")],\n    \"ai\": [f\"{BM}/{name}/{name}.list\"\
    \ for name in (\"OpenAI\", \"Anthropic\", \"Gemini\", \"Copilot\")],\n    \"google\"\
    : [f\"{BM}/Google/Google.list\", f\"{BM}/YouTube/YouTube.list\"],\n    \"telegram\"\
    : [f\"{BM}/Telegram/Telegram.list\"],\n    \"streaming\": [f\"{BM}/{name}/{name}.list\"\
    \ for name in (\"Netflix\", \"Disney\", \"HBO\", \"Spotify\", \"YouTubeMusic\"\
    , \"BiliBiliIntl\")],\n    \"social\": [f\"{BM}/{name}/{name}.list\" for name\
    \ in (\"TikTok\", \"Twitter\", \"Discord\", \"Reddit\", \"Whatsapp\", \"Instagram\"\
    , \"Facebook\")],\n    \"developer\": [f\"{BM}/{name}/{name}.list\" for name in\
    \ (\"GitHub\", \"GitLab\", \"Docker\", \"Npmjs\", \"Python\", \"Jetbrains\")],\n\
    \    \"cloud\": [f\"{BM}/{name}/{name}.list\" for name in (\"Dropbox\", \"GoogleDrive\"\
    , \"OneDrive\", \"iCloud\", \"Notion\", \"Slack\")],\n    \"speedtest\": [f\"\
    {BM}/Speedtest/Speedtest.list\"],\n    \"apple\": [f\"{BM}/Apple/Apple.list\"\
    ],\n    \"microsoft\": [f\"{BM}/Microsoft/Microsoft.list\"],\n    \"games\": [f\"\
    {BM}/Steam/Steam.list\", f\"{BM}/Game/Game.list\", f\"{BM}/Epic/Epic.list\"],\n\
    }\n\n\ndef github_api_raw_url(url: str) -> str | None:\n    prefix = \"https://raw.githubusercontent.com/\"\
    \n    if not url.startswith(prefix):\n        return None\n    parts = url.removeprefix(prefix).split(\"\
    /\", 3)\n    if len(parts) != 4:\n        return None\n    owner, repository,\
    \ ref, path = parts\n    return (f\"https://api.github.com/repos/{quote(owner,\
    \ safe='')}/{quote(repository, safe='')}/contents/\"\n            f\"{quote(path,\
    \ safe='/')}?ref={quote(ref, safe='')}\")\n\n\ndef fetch(url: str) -> bytes:\n\
    \    last_error = None\n    raw_candidate = (url, {})\n    api_url = github_api_raw_url(url)\n\
    \    api_candidate = (api_url, {\"Accept\": \"application/vnd.github.raw+json\"\
    }) if api_url else None\n    # Binary MRS downloads are where the current path\
    \ exhibits truncated raw\n    # responses. Prefer GitHub's official API for those\
    \ ~24 files while keeping\n    # the many small text lists on raw GitHub to stay\
    \ below API rate limits.\n    if api_candidate and url.endswith(\".mrs\"):\n \
    \       candidates = [api_candidate, raw_candidate]\n    else:\n        candidates\
    \ = [raw_candidate] + ([api_candidate] if api_candidate else [])\n    for candidate,\
    \ extra_headers in candidates:\n        for attempt in range(3):\n           \
    \ headers = {\"User-Agent\": \"re8ch-rule-sync/1\", **extra_headers}\n       \
    \     request = urllib.request.Request(candidate, headers=headers)\n         \
    \   try:\n                with urllib.request.urlopen(request, timeout=30) as\
    \ response:\n                    return response.read()\n            except (urllib.error.URLError,\
    \ TimeoutError, http.client.IncompleteRead) as exc:\n                last_error\
    \ = exc\n                if attempt < 2:\n                    time.sleep(2 **\
    \ attempt)\n    raise RuntimeError(f\"failed to fetch rules after retries: {url}\"\
    ) from last_error\n\n\ndef upstream_commits() -> dict:\n    commits = {}\n   \
    \ for repository, ref in UPSTREAM_REFS.items():\n        raw = fetch(f\"https://api.github.com/repos/{repository}/commits/{ref}\"\
    )\n        sha = str(json.loads(raw).get(\"sha\", \"\"))\n        if len(sha)\
    \ != 40:\n            raise ValueError(f\"invalid upstream commit: {repository}\"\
    )\n        commits[repository] = {\"ref\": ref, \"commit\": sha}\n    return commits\n\
    \n\ndef clean_list(parts: list[bytes]) -> bytes:\n    seen, lines = set(), []\n\
    \    for part in parts:\n        for raw in part.decode(\"utf-8-sig\").splitlines():\n\
    \            line = raw.strip()\n            if not line or line.startswith((\"\
    #\", \"//\")) or line in seen:\n                continue\n            seen.add(line)\n\
    \            lines.append(line)\n    if not lines:\n        raise ValueError(\"\
    empty rule list\")\n    return (\"\\n\".join(lines) + \"\\n\").encode()\n\n\n\
    def mosdns_domains(raw: bytes) -> bytes:\n    domains = []\n    for line in raw.decode().splitlines():\n\
    \        fields = [field.strip() for field in line.split(\",\")]\n        if len(fields)\
    \ < 2:\n            continue\n        if fields[0] == \"DOMAIN\":\n          \
    \  domains.append(f\"full:{fields[1]}\")\n        elif fields[0] == \"DOMAIN-SUFFIX\"\
    :\n            domains.append(f\"domain:{fields[1]}\")\n    if not domains:\n\
    \        raise ValueError(\"no MosDNS-compatible domains\")\n    return (\"\\\
    n\".join(dict.fromkeys(domains)) + \"\\n\").encode()\n\n\ndef metric(name: str,\
    \ raw: bytes) -> int:\n    return len(raw.splitlines()) if name.endswith(\".list\"\
    ) else len(raw)\n\n\ndef previous_manifest() -> dict:\n    path = ROOT / \"current\"\
    \ / \"manifest.json\"\n    return json.loads(path.read_text()) if path.exists()\
    \ else {}\n\n\ndef verified_previous_artifact(name: str, sources: list[str], previous:\
    \ dict) -> bytes | None:\n    metadata = previous.get(\"artifacts\", {}).get(name,\
    \ {})\n    if metadata.get(\"sources\") != sources:\n        return None\n   \
    \ path = ROOT / \"current\" / name\n    if not path.exists():\n        return\
    \ None\n    raw = path.read_bytes()\n    if hashlib.sha256(raw).hexdigest() !=\
    \ metadata.get(\"sha256\"):\n        return None\n    return raw\n\n\ndef incremental_list_parts(name:\
    \ str, urls: list[str], previous: dict) -> tuple[list[bytes], list[str]]:\n  \
    \  if int(previous.get(\"recipeRevision\", 1)) == RECIPE_REVISION:\n        return\
    \ [], urls\n    filename = f\"{name}.list\"\n    old_sources = previous.get(\"\
    artifacts\", {}).get(filename, {}).get(\"sources\", [])\n    if not old_sources\
    \ or urls[:len(old_sources)] != old_sources:\n        return [], urls\n    raw\
    \ = verified_previous_artifact(filename, old_sources, previous)\n    return ([raw],\
    \ urls[len(old_sources):]) if raw is not None else ([], urls)\n\n\ndef validate_change(name:\
    \ str, value: int, previous: dict) -> None:\n    if int(previous.get(\"recipeRevision\"\
    , 1)) != RECIPE_REVISION:\n        return\n    old = int(previous.get(\"artifacts\"\
    , {}).get(name, {}).get(\"metric\", 0) or 0)\n    if old and abs(value - old)\
    \ / old > 0.25:\n        raise ValueError(f\"abnormal rule size change: {name}:\
    \ {old} -> {value}\")\n\n\ndef sync(now: int | None = None) -> str:\n    stamp\
    \ = time.strftime(\"%Y%m%dT%H%M%SZ\", time.gmtime(time.time() if now is None else\
    \ now))\n    versions, stage = ROOT / \"versions\", ROOT / f\".stage-{stamp}-{os.getpid()}\"\
    \n    versions.mkdir(parents=True, exist_ok=True)\n    stage.mkdir(parents=True)\n\
    \    previous = previous_manifest()\n    artifacts = {}\n    try:\n        for\
    \ name, url in MRS_SOURCES.items():\n            filename = f\"{name}.mrs\"\n\
    \            raw = None\n            if int(previous.get(\"recipeRevision\", 1))\
    \ != RECIPE_REVISION:\n                raw = verified_previous_artifact(filename,\
    \ [url], previous)\n            raw = raw if raw is not None else fetch(url)\n\
    \            if len(raw) < 128:\n                raise ValueError(f\"invalid MRS:\
    \ {name}\")\n            value = metric(filename, raw)\n            validate_change(filename,\
    \ value, previous)\n            (stage / filename).write_bytes(raw)\n        \
    \    artifacts[filename] = {\"sha256\": hashlib.sha256(raw).hexdigest(), \"metric\"\
    : value, \"sources\": [url]}\n        for name, urls in LIST_SOURCES.items():\n\
    \            prior_parts, remaining_urls = incremental_list_parts(name, urls,\
    \ previous)\n            raw = clean_list(prior_parts + [fetch(url) for url in\
    \ remaining_urls])\n            filename = f\"{name}.list\"\n            value\
    \ = metric(filename, raw)\n            validate_change(filename, value, previous)\n\
    \            (stage / filename).write_bytes(raw)\n            artifacts[filename]\
    \ = {\"sha256\": hashlib.sha256(raw).hexdigest(), \"metric\": value, \"sources\"\
    : urls}\n            if name in {\"private\", \"cn\"}:\n                dns_raw\
    \ = mosdns_domains(raw)\n                dns_name = f\"{name}-domains.txt\"\n\
    \                (stage / dns_name).write_bytes(dns_raw)\n                artifacts[dns_name]\
    \ = {\"sha256\": hashlib.sha256(dns_raw).hexdigest(), \"metric\": len(dns_raw.splitlines()),\
    \ \"sources\": urls}\n        manifest = {\"version\": stamp, \"createdAt\": int(time.time()),\
    \ \"recipeRevision\": RECIPE_REVISION,\n                    \"upstreams\": upstream_commits(),\
    \ \"artifacts\": artifacts}\n        (stage / \"manifest.json\").write_text(json.dumps(manifest,\
    \ indent=2, sort_keys=True) + \"\\n\")\n        destination = versions / stamp\n\
    \        stage.rename(destination)\n        link = ROOT / \".current-new\"\n \
    \       link.unlink(missing_ok=True)\n        link.symlink_to(destination.relative_to(ROOT),\
    \ target_is_directory=True)\n        link.replace(ROOT / \"current\")\n      \
    \  for old in sorted((p for p in versions.iterdir() if p.is_dir()), reverse=True)[7:]:\n\
    \            shutil.rmtree(old)\n        return stamp\n    except Exception:\n\
    \        shutil.rmtree(stage, ignore_errors=True)\n        raise\n\n\nif __name__\
    \ == \"__main__\":\n    print(sync())\n"
  telemetry.py: "#!/usr/bin/env python3\n\"\"\"Aggregate Mihomo connection counters\
    \ by authenticated inbound user.\"\"\"\n\nfrom __future__ import annotations\n\
    \nimport json\nimport os\nimport ssl\nimport time\nimport urllib.error\nimport\
    \ urllib.request\nfrom datetime import datetime, timezone\nfrom pathlib import\
    \ Path\n\nNAMESPACE = os.getenv(\"POD_NAMESPACE\", \"egress-fabric\")\nUSAGE_NAME\
    \ = os.getenv(\"USAGE_CONFIGMAP\", \"access-device-usage\")\nREGION = os.getenv(\"\
    ACCESS_REGION\", \"unknown\")\nCONTROLLER = os.getenv(\"MIHOMO_CONTROLLER\", \"\
    http://127.0.0.1:9090\")\nCONTROLLER_SECRET_PATH = Path(os.getenv(\"MIHOMO_CONTROLLER_SECRET_PATH\"\
    , \"/controller/secret\"))\n\n\ndef kube_request(method: str, path: str, body:\
    \ dict | None = None) -> dict:\n    host, port = os.environ[\"KUBERNETES_SERVICE_HOST\"\
    ], os.environ[\"KUBERNETES_SERVICE_PORT_HTTPS\"]\n    token = Path(\"/var/run/secrets/kubernetes.io/serviceaccount/token\"\
    ).read_text().strip()\n    raw = json.dumps(body).encode() if body is not None\
    \ else None\n    request = urllib.request.Request(f\"https://{host}:{port}{path}\"\
    , data=raw, method=method,\n                                     headers={\"Authorization\"\
    : f\"Bearer {token}\", \"Content-Type\": \"application/json\"})\n    context =\
    \ ssl.create_default_context(cafile=\"/var/run/secrets/kubernetes.io/serviceaccount/ca.crt\"\
    )\n    with urllib.request.urlopen(request, context=context, timeout=5) as response:\n\
    \        return json.load(response) if response.length != 0 else {}\n\n\ndef connections()\
    \ -> list[dict]:\n    secret = CONTROLLER_SECRET_PATH.read_text().strip()\n  \
    \  request = urllib.request.Request(f\"{CONTROLLER}/connections\", headers={\"\
    Authorization\": f\"Bearer {secret}\"})\n    with urllib.request.urlopen(request,\
    \ timeout=3) as response:\n        return json.load(response).get(\"connections\"\
    , [])\n\n\ndef accumulate(state: dict, snapshot: list[dict], now: int | None =\
    \ None) -> dict:\n    timestamp = int(time.time() if now is None else now)\n \
    \   month = datetime.fromtimestamp(timestamp, timezone.utc).strftime(\"%Y-%m\"\
    )\n    if state.get(\"month\") != month:\n        state = {\"month\": month, \"\
    connections\": {}, \"devices\": {}}\n    old_connections = state.setdefault(\"\
    connections\", {})\n    devices = state.setdefault(\"devices\", {})\n    active\
    \ = {}\n    for connection in snapshot:\n        metadata = connection.get(\"\
    metadata\", {})\n        user = str(metadata.get(\"inboundUser\", \"\")).strip()\n\
    \        connection_id = str(connection.get(\"id\", \"\")).strip()\n        if\
    \ not user or not connection_id:\n            continue\n        upload, download\
    \ = int(connection.get(\"upload\", 0)), int(connection.get(\"download\", 0))\n\
    \        previous = old_connections.get(connection_id, {})\n        item = devices.setdefault(user,\
    \ {\"upload\": 0, \"download\": 0})\n        item[\"upload\"] = int(item.get(\"\
    upload\", 0)) + max(0, upload - int(previous.get(\"upload\", 0)))\n        item[\"\
    download\"] = int(item.get(\"download\", 0)) + max(0, download - int(previous.get(\"\
    download\", 0)))\n        item[\"lastSeenAt\"] = timestamp\n        item[\"activeConnections\"\
    ] = int(item.get(\"activeConnections\", 0)) + 1\n        active[connection_id]\
    \ = {\"upload\": upload, \"download\": download, \"user\": user, \"seenAt\": timestamp}\n\
    \    for item in devices.values():\n        item[\"activeConnections\"] = 0\n\
    \    for item in active.values():\n        devices[item[\"user\"]][\"activeConnections\"\
    ] += 1\n    state[\"connections\"] = active\n    state[\"updatedAt\"] = timestamp\n\
    \    return state\n\n\ndef persist(snapshot: list[dict], attempts: int = 5) ->\
    \ None:\n    key = f\"usage-{REGION}.json\"\n    for _ in range(attempts):\n \
    \       item = kube_request(\"GET\", f\"/api/v1/namespaces/{NAMESPACE}/configmaps/{USAGE_NAME}\"\
    )\n        data = item.get(\"data\", {})\n        state = json.loads(data.get(key,\
    \ \"{}\"))\n        item[\"data\"] = {**data, key: json.dumps(accumulate(state,\
    \ snapshot), separators=(\",\", \":\"), sort_keys=True)}\n        item.pop(\"\
    status\", None)\n        try:\n            kube_request(\"PUT\", f\"/api/v1/namespaces/{NAMESPACE}/configmaps/{USAGE_NAME}\"\
    , item)\n            return\n        except urllib.error.HTTPError as exc:\n \
    \           if exc.code != 409:\n                raise\n    raise RuntimeError(\"\
    usage state update conflict\")\n\n\nif __name__ == \"__main__\":\n    while True:\n\
    \        try:\n            persist(connections())\n        except Exception as\
    \ exc:\n            print(json.dumps({\"level\": \"warning\", \"event\": \"telemetry-poll-failed\"\
    , \"error\": type(exc).__name__}), flush=True)\n        time.sleep(5)\n"
