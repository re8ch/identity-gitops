  namespace: opensandbox-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensandbox-orchestra-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensandbox-orchestra-proxy
    spec:
      containers:
      - command:
        - python3
        - /runtime/proxy.py
        env:
        - name: OPEN_SANDBOX_API_KEY
          valueFrom:
            secretKeyRef:
              key: api-key
              name: opensandbox-api-key
        - name: TEABLE_INFRA_API_KEY
          valueFrom:
            secretKeyRef:
              key: teable-api-key
              name: opensandbox-api-key
        image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
        name: proxy
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 96Mi
          requests:
            cpu: 5m
            memory: 24Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /runtime
          name: runtime
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: r640
      volumes:
      - configMap:
          name: opensandbox-orchestra-proxy
        name: runtime
