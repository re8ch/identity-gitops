apiVersion: v1
data:
  migration.sql: "begin;\n\n-- The public OAuth broker still uses legacy session IDs.\
    \ Resolve those IDs\n-- through the migration's immutable link and read current\
    \ organization rows.\n-- External provider observations may expire; organization\
    \ membership does not.\ncreate or replace function api.auth_broker_groups(p_legacy_user_id\
    \ bigint)\nreturns text[] language sql stable security definer\nset search_path\
    \ = pg_catalog, pg_temp as $$\n  with linked as (\n    select l.user_id\n    from\
    \ core.legacy_user_ids l\n    join auth.users u on u.id = l.user_id\n    where\
    \ l.legacy_user_id = p_legacy_user_id\n      and u.deleted_at is null\n      and\
    \ (u.banned_until is null or u.banned_until < now())\n      and u.email_confirmed_at\
    \ is not null\n  ), memberships as (\n    select m.tenant_ref, m.role\n    from\
    \ linked l\n    join core.organization_members m on m.user_id = l.user_id\n  \
    \  join core.organizations o on o.tenant_ref = m.tenant_ref\n    where m.status\
    \ = 'active' and o.status = 'active'\n      and o.kind <> 'personal'\n  ), projected\
    \ as (\n    select 'tenant:' || tenant_ref || ':' || role as value from memberships\n\
    \    union all\n    select 're8ch:k8s-admins' from memberships\n      where tenant_ref\
    \ = 'admin' and role in ('owner', 'admin')\n    union all\n    select 're8ch:tenant-admins'\
    \ from memberships\n      where tenant_ref = 'admin' and role in ('owner', 'admin')\n\
    \  )\n  select coalesce(array_agg(distinct value order by value), '{}'::text[])\n\
    \  from projected;\n$$;\nalter function api.auth_broker_groups(bigint) owner to\
    \ supabase_admin;\nrevoke all on function api.auth_broker_groups(bigint) from\
    \ public, anon, authenticated, service_role;\ngrant execute on function api.auth_broker_groups(bigint)\
    \ to identity_service;\nnotify pgrst, 'reload schema';\n\ncommit;\n"
