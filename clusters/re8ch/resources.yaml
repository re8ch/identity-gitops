  kong-entrypoint.sh: "#!/bin/sh\nif [ -n \"$SUPABASE_SECRET_KEY\" ] && [ -n \"$SUPABASE_PUBLISHABLE_KEY\"\
    \ ]; then\n  export LUA_AUTH_EXPR=\"\\$((headers.authorization ~= nil and headers.authorization:sub(1,\
    \ 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '$SUPABASE_SECRET_KEY'\
    \ and 'Bearer $SERVICE_ROLE_KEY_ASYMMETRIC') or (headers.apikey == '$SUPABASE_PUBLISHABLE_KEY'\
    \ and 'Bearer $ANON_KEY_ASYMMETRIC') or headers.apikey)\"\n  export LUA_RT_WS_EXPR=\"\
    \\$((query_params.apikey == '$SUPABASE_SECRET_KEY' and '$SERVICE_ROLE_KEY_ASYMMETRIC')\
    \ or (query_params.apikey == '$SUPABASE_PUBLISHABLE_KEY' and '$ANON_KEY_ASYMMETRIC')\
    \ or query_params.apikey)\"\nelse\n  export LUA_AUTH_EXPR=\"\\$((headers.authorization\
    \ ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization)\
    \ or headers.apikey)\"\n  export LUA_RT_WS_EXPR=\"\\$(query_params.apikey)\"\n\
    fi\nawk '{\n  result = \"\"\n  rest = $0\n  while (match(rest, /\\$[A-Za-z_][A-Za-z_0-9]*/))\
    \ {\n    varname = substr(rest, RSTART + 1, RLENGTH - 1)\n    if (varname in ENVIRON)\
    \ {\n      result = result substr(rest, 1, RSTART - 1) ENVIRON[varname]\n    }\
    \ else {\n      result = result substr(rest, 1, RSTART + RLENGTH - 1)\n    }\n\
    \    rest = substr(rest, RSTART + RLENGTH)\n  }\n  print result rest\n}' /home/kong/temp.yml\
    \ > \"$KONG_DECLARATIVE_CONFIG\"\nsed -i '/^[[:space:]]*- key:[[:space:]]*$/d'\
    \ \"$KONG_DECLARATIVE_CONFIG\"\nexec /entrypoint.sh kong docker-start\n"
  kong.yml: "_format_version: '2.1'\n_transform: true\nconsumers:\n  - username: DASHBOARD\n\
    \  - username: anon\n    keyauth_credentials:\n      - key: $SUPABASE_ANON_KEY\n\
    \  - username: service_role\n    keyauth_credentials:\n      - key: $SUPABASE_SERVICE_KEY\n\
    acls:\n  - consumer: anon\n    group: anon\n  - consumer: service_role\n    group:\
