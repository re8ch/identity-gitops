apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: webmail
    app.kubernetes.io/name: stalwart-webmail
  name: stalwart-webmail
  namespace: mail-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart-webmail
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: webmail
        app.kubernetes.io/name: stalwart-webmail
    spec:
      automountServiceAccountToken: false
      # Keep OAuth token exchange and JMAP discovery independent from the
      # cross-region cluster DNS path. The authoritative mail workload already
      # uses the same bounded public resolvers on overseas-flk.
      dnsConfig:
        nameservers:
        - 1.1.1.1
        - 1.0.0.1
        options:
        - name: ndots
          value: '1'
      dnsPolicy: None
      containers:
      - env:
        - name: HOSTNAME
          value: 0.0.0.0
        - name: PORT
          value: '3000'
        - name: JMAP_SERVER_URL
          value: https://id.re8ch.com
        - name: OAUTH_ENABLED
          value: 'true'
        - name: OAUTH_ONLY
          value: 'true'
        - name: OAUTH_CLIENT_ID
          value: 705c1168-43d8-4ec3-980a-0327a59c7fc6
        - name: OAUTH_ISSUER_URL
          value: https://db-rw.re8ch.com/auth/v1
        - name: APP_NAME
          value: RE8CH Mail
        - name: APP_SHORT_NAME
          value: Mail
        - name: LOGIN_COMPANY_NAME
          value: RE8CH
        - name: LOGIN_WEBSITE_URL
          value: https://re8ch.com
        - name: ALLOW_CUSTOM_JMAP_ENDPOINT
          value: 'false'
        - name: SETTINGS_SYNC_ENABLED
          value: 'false'
        - name: ADMIN_CONFIG_READONLY
          value: 'true'
        - name: BULWARK_TELEMETRY
          value: 'off'
        image: ghcr.io/bulwarkmail/webmail:1.10.0@sha256:f3b59980ccccb45e710f3e4e93cd5c1a66a6175fbf64493e0c86aa6f7fe6ac6b
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
        name: webmail
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /app/data
          name: data
        - mountPath: /tmp
          name: tmp
      nodeSelector:
        kubernetes.io/hostname: overseas-flk
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: overseas-edge
      - effect: NoSchedule
        key: scheduling.re8ch.com/capacity-window
        operator: Equal
        value: closed
      volumes:
      - emptyDir: {}
        name: data
      - emptyDir: {}
        name: tmp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart-flk
  namespace: mail-system
spec:
  podManagementPolicy: OrderedReady
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  serviceName: stalwart-headless
  template:
    metadata:
      annotations:
        governance.re8ch.com/mail-authority: staged
      labels:
        app.kubernetes.io/name: stalwart
    spec:
      containers:
      - args:
        - --config
        - /etc/stalwart/config.json
        env:
        - name: STALWART_PUBLIC_URL
          value: https://id.re8ch.com
        envFrom:
        - secretRef:
            name: stalwart-recovery-admin
        image: ghcr.io/stalwartlabs/stalwart:v0.16.18@sha256:9ed1d343243b7aa72969e372a7240b7ddea07730781d4b68a0dc3d8d51c418bb
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /healthz/live
            port: management
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 10
        name: stalwart
        ports:
        - containerPort: 25
          name: smtp
        - containerPort: 465
          name: smtps
        - containerPort: 587
          name: submission
        - containerPort: 143
          name: imap
        - containerPort: 993
          name: imaps
        - containerPort: 110
          name: pop3
        - containerPort: 995
          name: pop3s
        - containerPort: 4190
          name: sieve
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        - containerPort: 8080
          name: management
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: management
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 10
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /healthz/live
            port: management
          periodSeconds: 10
          timeoutSeconds: 10
        volumeMounts:
        - mountPath: /etc/stalwart
          name: config
          readOnly: true
        - mountPath: /var/lib/stalwart
          name: data
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/run/stalwart-tls
          name: mail-tls
          readOnly: true
        - mountPath: /var/run/stalwart-secrets/cloudflare
          name: cloudflare-token
          readOnly: true
        - mountPath: /var/run/stalwart-secrets/cloudflare-re8ch
          name: cloudflare-re8ch-token
          readOnly: true
        - mountPath: /var/run/stalwart-idp
          name: oidc-keys
          readOnly: true
      dnsConfig:
        nameservers:
        - 1.1.1.1
        - 1.0.0.1
        options:
        - name: ndots
          value: '1'
      dnsPolicy: None
      initContainers:
      - args:
        - 'until [ -f /var/lib/stalwart/.r640-migration-v2-complete ]; do sleep 5;
          done

          test -f /var/lib/stalwart/CURRENT

          '
        command:
        - /bin/sh
        - -ceu
        image: alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
        name: wait-for-migration
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /var/lib/stalwart
          name: data
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: overseas-flk
      securityContext:
        fsGroup: 2000
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: overseas-edge
      - effect: NoSchedule
        key: scheduling.re8ch.com/capacity-window
        operator: Equal
        value: closed
      volumes:
      - configMap:
          name: stalwart-config
        name: config
      - emptyDir: {}
        name: tmp
      - name: data
        persistentVolumeClaim:
          claimName: stalwart-flk-local-data
      - name: mail-tls
        secret:
          secretName: stalwart-mail-re8ch-tls
      - name: cloudflare-token
        secret:
          items:
          - key: CF_API_TOKEN
            path: token
          optional: true
          secretName: stalwart-cloudflare-phonaid-token
      - name: cloudflare-re8ch-token
        secret:
          items:
          - key: CF_API_TOKEN
            path: token
          optional: true
          secretName: stalwart-cloudflare-dns-token
      - name: oidc-keys
        secret:
          secretName: stalwart-idp-oidc-keys
  updateStrategy:
    type: RollingUpdate
