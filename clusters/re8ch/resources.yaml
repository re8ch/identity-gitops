apiVersion: v1
data:
  auth-owner.sql: "-- Apply as supabase_auth_admin before 046_identity_platform_sessions.sql.\n\
    -- GoTrue owns session tables with RLS enabled. Expose a boolean for the verified\n\
    -- request only; SELECT grants alone do not cross this ownership boundary.\nbegin;\n\
    grant usage on schema auth to supabase_admin;\ngrant references(id) on auth.sessions,\
    \ auth.users to supabase_admin;\ncreate or replace function auth.platform_session_active()\n\
    returns boolean language sql stable security definer\nset search_path = pg_catalog,\
    \ pg_temp as $$\n  select exists (\n    select 1 from auth.sessions s\n    where\
    \ s.id = nullif(nullif(current_setting('request.jwt.claims', true), '')::jsonb\
    \ ->> 'session_id', '')::uuid\n      and s.user_id = nullif(nullif(current_setting('request.jwt.claims',\
    \ true), '')::jsonb ->> 'sub', '')::uuid\n      and (s.not_after is null or s.not_after\
    \ > now())\n      -- GoTrue v2.196 supports both legacy token rows and HMAC refresh\
    \ tokens.\n      -- HMAC sessions carry the rotation counter on the session itself.\n\
    \      and ((s.refresh_token_counter is not null and s.refresh_token_hmac_key\
    \ is not null)\n        or exists (select 1 from auth.refresh_tokens r where r.session_id\
    \ = s.id and not r.revoked))\n  )\n$$;\nalter function auth.platform_session_active()\
    \ owner to supabase_auth_admin;\nrevoke all on function auth.platform_session_active()\
    \ from public, anon, authenticated;\ngrant execute on function auth.platform_session_active()\
    \ to supabase_admin;\ncommit;\n-- Apply as the GoTrue table owner. Existing SELECT\
    \ grants do not bypass RLS.\n-- Only the trusted identity RPC owner can read users;\
    \ API roles receive no access.\nbegin;\ndrop policy if exists identity_rpc_user_read\
    \ on auth.users;\ncreate policy identity_rpc_user_read on auth.users for select\
    \ to supabase_admin using (true);\ncommit;\n"
  migration.sql: "-- Reviewed Cloud Functions 43eb7f2\n\n-- Persist one platform entitlement\
    \ decision per verified GoTrue login session.\n-- Token refresh preserves session_id;\
    \ a new login is evaluated independently.\nbegin;\ncreate table if not exists\
    \ core.platform_session_entitlements (\n  session_id uuid primary key references\
    \ auth.sessions(id) on delete cascade,\n  user_id uuid not null references auth.users(id)\
    \ on delete cascade,\n  allowed boolean not null,\n  decided_at timestamptz not\
    \ null default now()\n);\nalter table core.platform_session_entitlements owner\
    \ to supabase_admin;\nalter table core.platform_session_entitlements enable row\
    \ level security;\nrevoke all on core.platform_session_entitlements from public,\
    \ anon, authenticated;\n\ncreate or replace function api.platform_session_entitlement()\n\
    returns jsonb language plpgsql volatile security definer\nset search_path = pg_catalog,\
    \ pg_temp as $$\ndeclare v_user uuid := api.current_user_id(); v_session uuid;\
    \ v_allowed boolean;\nbegin\n  v_session := nullif(nullif(current_setting('request.jwt.claims',\
    \ true), '')::jsonb\n    ->> 'session_id', '')::uuid;\n  if v_user is null or\
    \ v_session is null then\n    raise exception 'authenticated login session required'\
    \ using errcode = '28000';\n  end if;\n  -- No cached grant outlives logout, revocation,\
    \ expiry, or its actual owner.\n  if not auth.platform_session_active() then\n\
    \    raise exception 'session is no longer active' using errcode = '28000';\n\
    \  end if;\n  select allowed into v_allowed from core.platform_session_entitlements\n\
    \    where session_id = v_session and user_id = v_user;\n  if not found then\n\
    \    -- Concurrent replicas must not evaluate and overwrite different decisions.\n\
    \    perform pg_advisory_xact_lock(hashtextextended('platform-session:' || v_session::text,\
    \ 0));\n    select allowed into v_allowed from core.platform_session_entitlements\n\
    \      where session_id = v_session and user_id = v_user;\n    if not found then\n\
    \      v_allowed := core.is_platform_admin(v_user);\n      insert into core.platform_session_entitlements(session_id,\
    \ user_id, allowed)\n        values(v_session, v_user, v_allowed);\n    end if;\n\
    \  end if;\n  return jsonb_build_object('sessionId', v_session, 'subject', v_user,\
    \ 'platformAdmin', v_allowed);\nend $$;\nalter function api.platform_session_entitlement()\
    \ owner to supabase_admin;\nrevoke all on function api.platform_session_entitlement()\
    \ from public, anon;\ngrant execute on function api.platform_session_entitlement()\
    \ to authenticated;\ncommit;\nnotify pgrst, 'reload schema';\n\n-- Platform sessions\
    \ reuse the established organization functions and invariants.\n-- A session grant\
    \ is not an organization membership: only this authenticated\n-- login can use\
    \ it, and it disappears with the actual GoTrue session.\nbegin;\ncreate or replace\
    \ function core.has_platform_session(p_user_id uuid)\nreturns boolean language\
    \ sql stable security definer\nset search_path=pg_catalog,pg_temp as $$\n select\
    \ p_user_id=api.current_user_id() and auth.platform_session_active() and exists(\n\
    \  select 1 from core.platform_session_entitlements g\n  where g.user_id=p_user_id\
    \ and g.allowed\n   and g.session_id::text=coalesce(nullif(current_setting('request.jwt.claims',true),'')::jsonb->>'session_id',''))\n\
    $$;\nalter function core.has_platform_session(uuid) owner to supabase_admin;\n\
    revoke all on function core.has_platform_session(uuid) from public,anon,authenticated;\n\
    \n-- Keep the existing UI's step-up rule for sessions without a platform grant.\n\
    create or replace function core.require_admin_step_up()\nreturns void language\
    \ plpgsql stable security definer\nset search_path=pg_catalog,pg_temp as $$\n\
    begin\n if core.has_platform_session(api.current_user_id()) then return;end if;\n\
    \ if coalesce(nullif(current_setting('request.jwt.claims',true),'')::jsonb->>'aal','')<>'aal2'\
    \ then\n  raise exception 'verify your authenticator before this admin action'\
    \ using errcode='42501';\n end if;\nend $$;\nalter function core.require_admin_step_up()\
    \ owner to supabase_admin;\nrevoke all on function core.require_admin_step_up()\
    \ from public,anon,authenticated;\n\ncreate or replace function core.can_manage_org(p_user_id\
    \ uuid,p_tenant_ref text,p_owner_only boolean default false)\nreturns boolean\
    \ language sql stable security definer\nset search_path=pg_catalog,pg_temp as\
    \ $$\n with recursive ancestors(tenant_ref,parent_ref,depth) as (\n  select tenant_ref,parent_ref,0\
    \ from core.organizations where tenant_ref=p_tenant_ref and status='active'\n\
    \  union all\n  select p.tenant_ref,p.parent_ref,a.depth+1 from core.organizations\
    \ p join ancestors a on p.tenant_ref=a.parent_ref\n   where p.status='active'\
    \ and a.depth<50)\n select (core.has_platform_session(p_user_id) and exists(select\
    \ 1 from ancestors)) or exists(\n  select 1 from ancestors a join core.organization_members\
    \ m on m.tenant_ref=a.tenant_ref\n  where m.user_id=p_user_id and m.status='active'\
    \ and (m.role='owner' or (not p_owner_only and m.role='admin')))\n$$;\nalter function\
    \ core.can_manage_org(uuid,text,boolean) owner to supabase_admin;\nrevoke all\
    \ on function core.can_manage_org(uuid,text,boolean) from public,anon,authenticated;\n\
    \ncreate or replace function api.platform_organization_get(p_tenant_ref text)\n\
    returns jsonb language plpgsql stable security definer\nset search_path=pg_catalog,pg_temp\
    \ as $$\ndeclare v_org core.organizations;\nbegin\n if not core.has_platform_session(api.current_user_id())\
    \ then raise exception 'platform session required' using errcode='42501';end if;\n\
    \ select * into v_org from core.organizations where tenant_ref=p_tenant_ref;\n\
    \ if not found then raise exception 'organization not found' using errcode='P0002';end\
    \ if;\n return jsonb_build_object('tenantRef',v_org.tenant_ref,'displayName',v_org.display_name,'parentRef',v_org.parent_ref,'kind',v_org.kind,'status',v_org.status);\n\
    end $$;\nalter function api.platform_organization_get(text) owner to supabase_admin;\n\
    revoke all on function api.platform_organization_get(text) from public,anon;\n\
    grant execute on function api.platform_organization_get(text) to authenticated;\n\
    \ncreate or replace function api.platform_organization_members(p_tenant_ref text,p_limit\
    \ integer default 100,p_offset integer default 0)\nreturns jsonb language plpgsql\
    \ stable security definer\nset search_path=pg_catalog,pg_temp as $$\ndeclare v_result\
    \ jsonb;\nbegin\n perform api.platform_organization_get(p_tenant_ref);\n if p_limit\
    \ is null or p_limit<1 or p_limit>250 or p_offset is null or p_offset<0 then raise\
    \ exception 'invalid pagination';end if;\n select coalesce(jsonb_agg(to_jsonb(m)),'[]'::jsonb)\
    \ into v_result from (\n  select user_id as \"userId\",role,status,created_at\
    \ as \"createdAt\",updated_at as \"updatedAt\"\n  from core.organization_members\
    \ where tenant_ref=p_tenant_ref order by created_at,user_id limit p_limit offset\
    \ p_offset) m;\n return jsonb_build_object('tenantRef',p_tenant_ref,'members',v_result);\n\
    end $$;\nalter function api.platform_organization_members(text,integer,integer)\
    \ owner to supabase_admin;\nrevoke all on function api.platform_organization_members(text,integer,integer)\
    \ from public,anon;\ngrant execute on function api.platform_organization_members(text,integer,integer)\
    \ to authenticated;\ncommit;\nnotify pgrst,'reload schema';\n\n-- User CRUD source:\
    \ re8ch/cloud-functions PR #107\n-- Credential lifecycle belongs to GoTrue, never\
    \ direct writes to auth.users.\nbegin;\ncreate or replace function api.platform_user_delete_guard(p_user_id\
    \ uuid)\nreturns jsonb language plpgsql volatile security definer\nset search_path=pg_catalog,pg_temp\
    \ as $$\nbegin\n if not core.has_platform_session(api.current_user_id()) then\
    \ raise exception 'platform session required' using errcode='42501';end if;\n\
    \ if p_user_id=api.current_user_id() or exists(select 1 from core.organization_members\
    \ where user_id=p_user_id and tenant_ref='admin' and status='active') then\n \
    \ raise exception 'protected user' using errcode='23505';\n end if;\n if not exists(select\
    \ 1 from auth.users where id=p_user_id and deleted_at is null) then raise exception\
    \ 'user not found' using errcode='P0002';end if;\n if exists(select 1 from core.organization_members\
    \ m join core.organizations o on o.tenant_ref=m.tenant_ref where m.user_id=p_user_id\
    \ and m.status='active' and o.kind<>'personal' and o.status='active') then\n \
    \ raise exception 'remove organization memberships before deleting user' using\
    \ errcode='23505';\n end if;\n if exists(select 1 from core.organizations parent\
    \ join core.organizations child on child.parent_ref=parent.tenant_ref where parent.personal_owner_id=p_user_id\
    \ and child.status='active') then\n  raise exception 'move child organizations\
    \ before deleting user' using errcode='23505';\n end if;\n return jsonb_build_object('personalOrganizations',coalesce((select\
    \ jsonb_agg(tenant_ref) from core.organizations where personal_owner_id=p_user_id\
    \ and kind='personal'),'[]'::jsonb));\nend $$;\nalter function api.platform_user_delete_guard(uuid)\
    \ owner to supabase_admin;\nrevoke all on function api.platform_user_delete_guard(uuid)\
    \ from public,anon;\ngrant execute on function api.platform_user_delete_guard(uuid)\
    \ to authenticated;\n-- Read and update the same profile authority used by User\
    \ Hub.\ncreate or replace function api.platform_users(p_user_id uuid default null,\
    \ p_page integer default 1, p_per_page integer default 50)\nreturns jsonb language\
    \ plpgsql stable security definer set search_path=pg_catalog,pg_temp as $$\ndeclare\
    \ result jsonb;\nbegin\n if not core.has_platform_session(api.current_user_id())\
    \ then raise exception 'platform session required' using errcode='42501';end if;\n\
    \ if p_page is null or p_page<1 or p_page>10000 or p_per_page is null or p_per_page<1\
    \ or p_per_page>100 then raise exception 'invalid pagination' using errcode='22023';end\
    \ if;\n select coalesce(jsonb_agg(row), '[]'::jsonb) into result from (\n  select\
    \ u.id,coalesce(u.email,'') as email,coalesce(p.display_name,'') as \"displayName\"\
    ,u.created_at as \"createdAt\",\n   u.email_confirmed_at is not null as \"emailConfirmed\"\
    ,false as deleted\n  from auth.users u left join core.user_profiles p on p.user_id=u.id\n\
    \  where u.deleted_at is null and (p_user_id is null or u.id=p_user_id)\n  order\
    \ by u.created_at,u.id limit p_per_page offset ((p_page-1)*p_per_page)\n ) row;\n\
    \ if p_user_id is not null then\n  if jsonb_array_length(result)=0 then raise\
    \ exception 'user not found' using errcode='P0002';end if;\n  return result->0;\n\
    \ end if;\n return jsonb_build_object('users',result);\nend $$;\nalter function\
    \ api.platform_users(uuid,integer,integer) owner to supabase_admin;\nrevoke all\
    \ on function api.platform_users(uuid,integer,integer) from public,anon;\ngrant\
    \ execute on function api.platform_users(uuid,integer,integer) to authenticated;\n\
    \ncreate or replace function api.platform_user_update(p_user_id uuid,p_display_name\
    \ text)\nreturns jsonb language plpgsql volatile security definer set search_path=pg_catalog,pg_temp\
    \ as $$\nbegin\n perform api.platform_users(p_user_id);\n if p_display_name is\
    \ null or length(btrim(p_display_name)) not between 1 and 80 then raise exception\
    \ 'invalid display name' using errcode='22023';end if;\n perform core.ensure_user_profile(p_user_id);\n\
    \ update core.user_profiles set display_name=btrim(p_display_name),updated_at=now()\
    \ where user_id=p_user_id;\n return api.platform_users(p_user_id);\nend $$;\n\
    alter function api.platform_user_update(uuid,text) owner to supabase_admin;\n\
    revoke all on function api.platform_user_update(uuid,text) from public,anon;\n\
    grant execute on function api.platform_user_update(uuid,text) to authenticated;\n\
    notify pgrst,'reload schema';\ncommit;\n"
kind: ConfigMap
metadata:
  name: supabase-platform-admin-api-v5
  namespace: supabase-identity
---
apiVersion: v1
data:
  migration.sql: "begin;\nupdate core.organizations set display_name = 'Re8CH Admin',\
    \ updated_at = now() where tenant_ref = 'admin';\nupdate core.organizations set\
    \ display_name = 'Re8ch', parent_ref = 'admin', updated_at = now() where tenant_ref\
    \ = 're8ch';\n\ncreate table if not exists core.organization_context_audit (\n\
    \  id bigint generated always as identity primary key,\n  actor_user_id uuid references\
    \ auth.users(id) on delete set null,\n  source_tenant_ref text,\n  target_tenant_ref\
    \ text,\n  action text not null,\n  before_state jsonb not null default '{}'::jsonb,\n\
    \  after_state jsonb not null default '{}'::jsonb,\n  request_id text,\n  created_at\
    \ timestamptz not null default now()\n);\nalter table core.organization_context_audit\
    \ owner to supabase_admin;\nalter table core.organization_context_audit enable\
    \ row level security;\nrevoke all on core.organization_context_audit from public,\
    \ anon, authenticated, service_role;\n\n-- Membership is an entitlement, not the\
    \ current request context. A user may\n-- belong to multiple organizations; user_active_organizations\
    \ below selects\n-- the single organization whose resources are active for the\
    \ session.\n\ncreate table if not exists core.user_active_organizations (\n  user_id\
    \ uuid primary key references auth.users(id) on delete cascade,\n  tenant_ref\
    \ text not null references core.organizations(tenant_ref),\n  updated_at timestamptz\
    \ not null default now()\n);\nalter table core.user_active_organizations owner\
    \ to supabase_admin;\nalter table core.user_active_organizations enable row level\
    \ security;\nrevoke all on core.user_active_organizations from public, anon, authenticated,\
    \ service_role;\n\ninsert into core.user_active_organizations(user_id, tenant_ref)\n\
    select u.id, choice.tenant_ref from auth.users u\ncross join lateral (\n  select\
    \ m.tenant_ref from core.organization_members m\n  join core.organizations o on\
    \ o.tenant_ref = m.tenant_ref\n  where m.user_id = u.id and m.status = 'active'\
    \ and o.status = 'active'\n  order by case when o.kind <> 'personal' then 0 else\
    \ 1 end,\n    case m.tenant_ref when 'admin' then 0 when 're8ch' then 1 else 2\
    \ end, m.tenant_ref\n  limit 1\n) choice\nwhere u.deleted_at is null on conflict\
    \ (user_id) do nothing;\n\ncreate or replace function core.can_access_tenant_resources(p_user_id\
    \ uuid, p_tenant_ref text)\nreturns boolean language sql stable security definer\
    \ set search_path = pg_catalog, pg_temp as $$\n  select p_user_id = api.current_user_id()\
    \ and exists (\n    select 1 from core.organization_members m\n    join core.organizations\
    \ o on o.tenant_ref = m.tenant_ref\n    join core.user_active_organizations a\
    \ on a.user_id = m.user_id and a.tenant_ref = m.tenant_ref\n    where m.user_id\
    \ = p_user_id and m.tenant_ref = p_tenant_ref\n      and m.status = 'active' and\
    \ o.status = 'active')\n$$;\nalter function core.can_access_tenant_resources(uuid,\
    \ text) owner to supabase_admin;\nrevoke all on function core.can_access_tenant_resources(uuid,\
    \ text) from public, anon, authenticated, service_role;\n\ndrop function if exists\
    \ api.my_tenant_runtime_contexts();\ncreate function api.my_tenant_runtime_contexts()\n\
    returns table(tenant_ref text, tenant_role text, tenant_kind text, display_name\
    \ text, parent_ref text, is_active boolean)\nlanguage plpgsql volatile security\
    \ definer set search_path = pg_catalog, pg_temp as $$\ndeclare v_user uuid :=\
    \ api.current_user_id(); v_personal text; v_active text;\nbegin\n  if v_user is\
    \ null then raise exception 'authenticated user required' using errcode = '28000';\
    \ end if;\n  perform core.ensure_personal_organization(v_user);\n  update core.organization_members\
    \ m set status = 'active', role = 'owner', updated_at = now()\n  from core.organizations\
    \ o\n  where m.user_id = v_user and m.tenant_ref = o.tenant_ref\n    and o.kind\
    \ = 'personal' and o.personal_owner_id = v_user and o.status = 'active'\n    and\
    \ (m.status <> 'active' or m.role <> 'owner');\n  select o.tenant_ref into v_personal\
    \ from core.organizations o\n  join core.organization_members m on m.tenant_ref\
    \ = o.tenant_ref and m.user_id = v_user\n  where o.kind = 'personal' and o.personal_owner_id\
    \ = v_user\n    and o.status = 'active' and m.status = 'active' order by o.created_at\
    \ limit 1;\n  select a.tenant_ref into v_active from core.user_active_organizations\
    \ a\n  join core.organization_members m on m.user_id = a.user_id and m.tenant_ref\
    \ = a.tenant_ref\n  join core.organizations o on o.tenant_ref = a.tenant_ref\n\
    \  where a.user_id = v_user and m.status = 'active' and o.status = 'active';\n\
    \  if v_active is null and v_personal is not null then\n    insert into core.user_active_organizations(user_id,\
    \ tenant_ref, updated_at)\n    values(v_user, v_personal, now()) on conflict (user_id)\
    \ do update\n      set tenant_ref = excluded.tenant_ref, updated_at = excluded.updated_at;\n\
    \    v_active := v_personal;\n  end if;\n  return query select m.tenant_ref,\n\
    \    case m.role when 'owner' then 'admin' when 'admin' then 'admin'\n      when\
    \ 'member' then 'operator' when 'viewer' then 'viewer' end,\n    o.kind, o.display_name,\
    \ o.parent_ref, m.tenant_ref = v_active\n  from core.organization_members m join\
    \ core.organizations o on o.tenant_ref = m.tenant_ref\n  join auth.users u on\
    \ u.id = m.user_id\n  where m.user_id = v_user and m.status = 'active' and o.status\
    \ = 'active'\n    and u.deleted_at is null and m.role in ('owner', 'admin', 'member',\
    \ 'viewer')\n  order by (m.tenant_ref = v_active) desc, (o.kind = 'personal')\
    \ desc, m.tenant_ref;\nend $$;\nalter function api.my_tenant_runtime_contexts()\
    \ owner to supabase_admin;\nrevoke all on function api.my_tenant_runtime_contexts()\
    \ from public, anon, service_role;\ngrant usage on schema api to authenticated;\n\
    grant execute on function api.my_tenant_runtime_contexts() to authenticated;\n\
    \ncreate or replace function api.select_active_organization(p_tenant_ref text)\n\
    returns jsonb language plpgsql volatile security definer set search_path = pg_catalog,\
    \ pg_temp as $$\ndeclare v_user uuid := api.current_user_id(); v_before text;\
    \ v_request_id text;\nbegin\n  if v_user is null then raise exception 'authenticated\
    \ user required' using errcode = '28000'; end if;\n  if not exists (select 1 from\
    \ core.organization_members m\n    join core.organizations o on o.tenant_ref =\
    \ m.tenant_ref\n    where m.user_id = v_user and m.tenant_ref = p_tenant_ref\n\
    \      and m.status = 'active' and o.status = 'active') then\n    raise exception\
    \ 'active organization membership required' using errcode = '42501';\n  end if;\n\
    \  perform pg_advisory_xact_lock(hashtextextended('active-organization:' || v_user::text,\
    \ 0));\n  select tenant_ref into v_before from core.user_active_organizations\
    \ where user_id = v_user;\n  insert into core.user_active_organizations(user_id,\
    \ tenant_ref, updated_at)\n  values(v_user, p_tenant_ref, now()) on conflict (user_id)\
    \ do update\n    set tenant_ref = excluded.tenant_ref, updated_at = excluded.updated_at;\n\
    \  v_request_id := coalesce(nullif(current_setting('request.headers', true), '')::jsonb\
    \ ->> 'x-request-id', gen_random_uuid()::text);\n  insert into core.organization_context_audit(\n\
    \    actor_user_id, source_tenant_ref, target_tenant_ref, action, before_state,\
    \ after_state, request_id)\n  values(v_user, v_before, p_tenant_ref, 'active_organization_selected',\n\
    \    jsonb_build_object('tenantRef', v_before), jsonb_build_object('tenantRef',\
    \ p_tenant_ref), v_request_id);\n  return jsonb_build_object('tenantRef', p_tenant_ref,\
    \ 'active', true, 'requestId', v_request_id);\nend $$;\nalter function api.select_active_organization(text)\
    \ owner to supabase_admin;\nrevoke all on function api.select_active_organization(text)\
    \ from public, anon, service_role;\ngrant execute on function api.select_active_organization(text)\
    \ to authenticated;\nnotify pgrst, 'reload schema';\ncommit;\n"
