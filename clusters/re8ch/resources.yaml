kind: ConfigMap
metadata:
  name: stalwart-config
  namespace: mail-system
---
apiVersion: v1
data:
  reconcile.py: "import base64\nimport json\nimport os\nimport urllib.request\n\n\
    endpoint = os.environ[\"STALWART_URL\"].rstrip(\"/\") + \"/jmap\"\ncredential\
    \ = os.environ[\"STALWART_RECOVERY_ADMIN\"]\nauthorization = \"Basic \" + base64.b64encode(credential.encode()).decode()\n\
    \ndef call(name, arguments):\n    payload = json.dumps({\n        \"using\": [\"\
    urn:ietf:params:jmap:core\", \"urn:stalwart:jmap\"],\n        \"methodCalls\"\
    : [[name, arguments, \"alias\"]],\n    }).encode()\n    request = urllib.request.Request(endpoint,\
    \ payload, {\n        \"Authorization\": authorization,\n        \"Content-Type\"\
    : \"application/json\",\n    })\n    with urllib.request.urlopen(request, timeout=20)\
    \ as response:\n        result = json.load(response)[\"methodResponses\"][0]\n\
    \    if result[0] != name:\n        raise RuntimeError(\"Stalwart rejected the\
    \ account operation\")\n    return result[1]\n\ndef accounts():\n    return call(\"\
    x:Account/get\", {\n        \"ids\": None,\n        \"properties\": [\"name\"\
    , \"domainId\", \"emailAddress\", \"aliases\", \"permissions\"],\n    })[\"list\"\
    ]\n\ncurrent = accounts()\nmatches = [item for item in current if item.get(\"\
    emailAddress\") == \"harry@re8ch.com\"]\nif len(matches) != 1:\n    raise RuntimeError(\"\
    expected exactly one Harry mailbox\")\nharry = matches[0]\ndomain_id = harry[\"\
    domainId\"]\nfor item in current:\n    if item.get(\"emailAddress\") == \"admin@re8ch.com\"\
    \ and item[\"id\"] != harry[\"id\"]:\n        raise RuntimeError(\"admin address\
    \ belongs to another mailbox\")\n    for alias in (item.get(\"aliases\") or {}).values():\n\
    \        if alias.get(\"name\") == \"admin\" and alias.get(\"domainId\") == domain_id\
    \ and item[\"id\"] != harry[\"id\"]:\n            raise RuntimeError(\"admin alias\
    \ belongs to another mailbox\")\n\naliases = dict(harry.get(\"aliases\") or {})\n\
    if not any(value.get(\"name\") == \"admin\" and value.get(\"domainId\") == domain_id\
    \ for value in aliases.values()):\n    next_id = str(max((int(key) for key in\
    \ aliases if key.isdigit()), default=-1) + 1)\n    aliases[next_id] = {\"enabled\"\
    : True, \"name\": \"admin\", \"domainId\": domain_id}\n\nold_permissions = harry.get(\"\
    permissions\") or {\"@type\": \"Inherit\"}\nif old_permissions.get(\"@type\")\
    \ not in (\"Inherit\", \"Merge\"):\n    raise RuntimeError(\"refusing to replace\
    \ custom Harry mailbox permissions\")\nenabled = dict(old_permissions.get(\"enabledPermissions\"\
    ) or {})\ndisabled = dict(old_permissions.get(\"disabledPermissions\") or {})\n\
    if disabled.get(\"authenticateWithAlias\"):\n    raise RuntimeError(\"alias authentication\
    \ is explicitly denied\")\nenabled[\"authenticateWithAlias\"] = True\npermissions\
    \ = {\"@type\": \"Merge\", \"enabledPermissions\": enabled, \"disabledPermissions\"\
    : disabled}\n\nif aliases != (harry.get(\"aliases\") or {}) or permissions !=\
    \ old_permissions:\n    result = call(\"x:Account/set\", {\n        \"update\"\
    : {harry[\"id\"]: {\"aliases\": aliases, \"permissions\": permissions}},\n   \
    \ })\n    if harry[\"id\"] not in result.get(\"updated\", {}):\n        raise\
    \ RuntimeError(\"Stalwart did not update Harry mailbox\")\n\nupdated = next(item\
    \ for item in accounts() if item[\"id\"] == harry[\"id\"])\nif not any(value.get(\"\
    enabled\") and value.get(\"name\") == \"admin\" and value.get(\"domainId\") ==\
    \ domain_id for value in (updated.get(\"aliases\") or {}).values()):\n    raise\
    \ RuntimeError(\"admin mailbox alias was not saved\")\nif not (updated.get(\"\
    permissions\") or {}).get(\"enabledPermissions\", {}).get(\"authenticateWithAlias\"\
    ):\n    raise RuntimeError(\"alias sign-in permission was not saved\")\nprint(\"\
    harry@re8ch.com accepts admin@re8ch.com as mailbox alias\")\n"
