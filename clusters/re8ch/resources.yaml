    \ e=>{e.preventDefault();let r=await fetch('/api/devices',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:n.value||'device'})}),j=await\
    \ r.json();show(j);load()};load()</script></html>\"\"\"\n\nPORTAL = PORTAL.replace(\n\
    \    '<p>\u5305\u542B\u8282\u70B9\u3001\u7B56\u7565\u7EC4\u3001OpenAI/Google \u5206\
    \u6D41\u89C4\u5219\u548C\u5B89\u5168 DNS\u3002</p><div class=row><a class=\"cta\
    \ secondary\" href=\"${esc(j.shadowrocketImportURL)}\">\u4E00\u952E\u5B89\u88C5\
    </a>',\n    '<p>\u5305\u542B\u8282\u70B9\u3001\u7B56\u7565\u7EC4\u3001OpenAI/Google\
