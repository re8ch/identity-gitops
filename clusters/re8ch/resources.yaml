apiVersion: v1
data:
  app.py: "#!/usr/bin/env python3\n\"\"\"Auth Gateway-fronted Store, admin API and\
    \ device-scoped subscription service.\"\"\"\n\nfrom __future__ import annotations\n\
    \nimport hashlib\nimport hmac\nimport ipaddress\nimport json\nimport mimetypes\n\
    import os\nimport secrets\nimport socket\nimport ssl\nimport time\nimport urllib.error\n\
    import urllib.request\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\n\
    from pathlib import Path\nfrom urllib.parse import parse_qs, quote, urlencode,\
    \ urlparse\n\nfrom core import (DEFAULT_NODES, Node, Publication, RuntimeTarget,\
    \ authorization, canonical_subject, clash_meta_import_url, issue_token, mihomo_config,\
    \ proxy_password,\n                  public_node, shadowrocket_config, shadowrocket_import_url,\
    \ SHADOWROCKET_PROFILE_REVISION, subscription_body,\n                  subscription_headers,\
    \ v2box_subscription_body, v2box_subscription_import_url, verify_token)\n\nNAMESPACE\
    \ = os.getenv(\"POD_NAMESPACE\", \"egress-fabric\")\nSTATE_NAME = os.getenv(\"\
    STATE_CONFIGMAP\", \"access-subscription-devices\")\nAUTH_NAME = os.getenv(\"\
    AUTH_CONFIGMAP\", \"access-members-cache\")\nUSAGE_NAME = os.getenv(\"USAGE_CONFIGMAP\"\
    , \"access-device-usage\")\nRULES_ROOT = Path(os.getenv(\"RULES_ROOT\", \"/rules\"\
    ))\nBASE_URL = os.getenv(\"PUBLIC_BASE_URL\", \"https://sub.access.re8ch.com\"\
    ).rstrip(\"/\")\nHMAC_SECRET = Path(os.getenv(\"HMAC_SECRET_PATH\", \"/secrets/hmac-key\"\
    )).read_bytes().strip()\nIDENTITY_ALIASES = json.loads(os.getenv(\"IDENTITY_ALIASES_JSON\"\
    , \"{}\"))\nOAUTH_ISSUER = \"https://db-rw.re8ch.com/auth/v1\"\nOAUTH_AUTHORIZE_URL\
    \ = \"https://auth.re8ch.com/auth/v1/oauth/authorize\"\nOAUTH_CLIENT_ID = \"e93247af-5bc0-4f3d-829b-8a70e0a69d31\"\
    \nOAUTH_REDIRECT = BASE_URL + \"/oauth/callback\"\nSESSION_COOKIE = \"__Host-access_oauth\"\
    \nFLOW_COOKIE = \"__Host-access_oauth_flow\"\n\nPORTAL = \"\"\"<!doctype html><html\
    \ lang=zh-CN><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'>\n\
    <title>access re8ch com</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{font:16px\
    \ system-ui;margin:0;background:#101114;color:#eee}main{max-width:920px;margin:auto;padding:32px\
    \ 20px}button,input,a.cta{font:inherit;padding:11px 16px;border-radius:9px;border:1px\
    \ solid #3b414b}button{cursor:pointer}input{min-width:280px}a{color:#9ee6a8}.cta{display:inline-block;text-decoration:none;font-weight:650}.primary{background:#83dfa0;color:#102016;border-color:#83dfa0}.secondary{background:#292d35;color:#eee}.danger{color:#ff9c9c}article{background:#1d1f24;padding:20px;margin:14px\
    \ 0;border-radius:14px}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.choice{background:#17191e;border:1px\
    \ solid #353a44;border-radius:12px;padding:18px}.recommended{border-color:#72d993}.badge{display:inline-block;background:#244a31;color:#a8f0bd;padding:3px\
    \ 8px;border-radius:99px;font-size:13px;font-weight:700}.muted{color:#aaa}.warning{color:#ffd28a}.row{display:flex;gap:8px;flex-wrap:wrap}.steps{padding-left:22px;line-height:1.65}code.url{display:block;margin-top:10px;padding:10px;background:#0f1114;border-radius:8px;overflow-wrap:anywhere;color:#9ee6a8}@media(max-width:700px){.choice-grid{grid-template-columns:1fr}main{padding:20px\
    \ 12px}}</style>\n<main><h1>access re8ch com</h1><p>Mihomo/Shadowrocket \u5B8C\
    \u6574\u914D\u7F6E\uFF1A\u6D1B\u6749\u77F6\u53CC\u8282\u70B9\u4F18\u5148\u3001\
    \u5FB7\u56FD\u8282\u70B9\u53EF\u7528\u65F6\u5907\u7528\u3001\u8282\u70B9\u5168\
    \u4E0D\u53EF\u7528\u65F6\u76F4\u8FDE \xB7 \u6BCF\u6708 300 GB \u8F6F\u63D0\u9192\
    </p><p id=a></p><form id=f><input id=n maxlength=64 placeholder='\u8BBE\u5907\u540D\
    \u79F0\uFF0C\u4F8B\u5982 iPhone'><button>\u521B\u5EFA\u8BBE\u5907</button></form><div\
    \ id=new></div><div id=o></div><p class=muted>\u8BBE\u5907\u5730\u5740\u53EA\u663E\
    \u793A\u4E00\u6B21\uFF1B\u652F\u6301 V2Box \u8282\u70B9\u8BA2\u9605\u4EE5\u53CA\
    \ Shadowrocket \u5B8C\u6574\u914D\u7F6E\u3002</p></main>\n<script>const o=document.querySelector('#o'),a=document.querySelector('#a'),nn=document.querySelector('#new');function\
    \ esc(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}function\
    \ size(n){return (n/1073741824).toFixed(2)+' GB'}function when(n){return n?new\
    \ Date(n*1000).toLocaleString():'\u5C1A\u65E0'}async function load(){let r=await\
    \ fetch('/api/me'),j=await r.json();if(!r.ok){a.textContent=j.error||'\u672A\u6388\
    \u6743';return}a.textContent='\u8D26\u53F7\uFF1A'+j.account+(j.admin?' \xB7 \u7BA1\
    \u7406\u5458':'');o.innerHTML=(j.devices||[]).map(x=>`<article><b>${esc(x.name)}</b>\
    \ \xB7 ${x.enabled?'\u542F\u7528':'\u5DF2\u64A4\u9500'}<br><span class=muted>${x.activeConnections||0}\
    \ \u4E2A\u8FDE\u63A5 \xB7 \u672C\u6708 ${size((x.upload||0)+(x.download||0))}\
    \ \xB7 \u6700\u540E\u5728\u7EBF ${when(x.lastSeenAt)}</span><div class=row><button\
    \ onclick=\"rotate('${x.id}')\">\u8F6E\u6362\u5E76\u751F\u6210\u65B0\u914D\u7F6E\
    </button><button class=secondary onclick=\"revoke('${x.id}')\">\u64A4\u9500\u8BBE\
    \u5907</button></div></article>`).join('')||'<article>\u8FD8\u6CA1\u6709\u8BBE\
    \u5907\u3002\u8F93\u5165\u8BBE\u5907\u540D\u79F0\u5E76\u521B\u5EFA\uFF0C\u9875\
    \u9762\u4F1A\u751F\u6210\u4E00\u6B21\u6027\u5BFC\u5165\u5730\u5740\u3002</article>'}async\
    \ function revoke(id){await fetch('/api/devices/'+id,{method:'DELETE'});load()}async\
    \ function rotate(id){let r=await fetch('/api/devices/'+id+'/rotate',{method:'POST'}),j=await\
    \ r.json();show(j)}function show(j){if(!j.subscriptionURL)return alert(j.error||'\u521B\
    \u5EFA\u5931\u8D25');nn.innerHTML=`<article><h2>\u9009\u62E9\u5BFC\u5165\u65B9\
    \u5F0F</h2><div class=choice-grid><section class=\"choice recommended\"><span\
    \ class=badge>V2Box</span><h3>V2Box \u8282\u70B9\u8BA2\u9605</h3><p>\u76F4\u63A5\
    \u521B\u5EFA\u53EF\u81EA\u52A8\u66F4\u65B0\u7684\u8BBE\u5907\u4E13\u5C5E\u8BA2\
    \u9605\uFF0C\u5305\u542B\u5F53\u524D\u5DF2\u9A8C\u8BC1\u7684\u8282\u70B9\uFF1B\
    \u6D41\u91CF\u4FE1\u606F\u548C\u5230\u671F\u65F6\u95F4\u4F1A\u968F\u8BA2\u9605\
    \u8FD4\u56DE\u3002</p><div class=row><a class=\"cta primary\" href=\"${esc(j.v2boxImportURL)}\"\
    >\u4E00\u952E\u5BFC\u5165 V2Box</a><a class=\"cta secondary\" href=\"${esc(j.v2boxURL)}\"\
    >\u6253\u5F00\u8BA2\u9605\u914D\u7F6E</a></div><h4>\u624B\u52A8\u5BFC\u5165</h4><ol\
    \ class=steps><li>\u8FDB\u5165 V2Box \u2192 <b>Configs</b> \u2192 <b>+</b> \u2192\
    \ <b>Add Subscription</b>\u3002</li><li>\u540D\u79F0\u586B\u5199 <code>access\
    \ re8ch com</code>\uFF0CURL \u7C98\u8D34\u4E0B\u65B9\u5730\u5740\u5E76\u4FDD\u5B58\
    \u3002</li></ol><code class=url>${esc(j.v2boxURL)}</code></section><section class=choice><h3>Shadowrocket\
    \ \u5B8C\u6574\u914D\u7F6E</h3><p>\u5305\u542B\u8282\u70B9\u3001\u7B56\u7565\u7EC4\
    \u3001OpenAI/Google \u5206\u6D41\u89C4\u5219\u548C\u5B89\u5168 DNS\u3002</p><div\
