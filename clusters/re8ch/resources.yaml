    >\u4E00\u952E\u5B89\u88C5</a><a class=\"cta secondary\" href=\"${esc(j.shadowrocketURL)}\"\
    \ download=\"re8ch-shadowrocket.conf\">\u4E0B\u8F7D .conf</a></div><hr><h3>Mihomo\
    \ \u5B8C\u6574\u914D\u7F6E</h3><p>\u4F9B Clash Meta\u3001Mihomo \u548C\u517C\u5BB9\
    \u5BA2\u6237\u7AEF\u4F7F\u7528\u3002</p><div class=row><a class=\"cta secondary\"\
